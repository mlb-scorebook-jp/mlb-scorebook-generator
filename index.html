            const getChallengeLogEntries = (data) => {
                const entries = [];
                const seen = new Set();
                const plays = data?.liveData?.plays?.allPlays ?? [];

                const appendEntry = (entry) => {
                    const key = [
                        entry.type,
                        entry.playIndex,
                        entry.type === "ABS" ? entry.eventIndex : "play",
                        entry.team,
                        entry.challenger,
                        entry.resultText
                    ].join("|");
                    if (seen.has(key)) return;
                    seen.add(key);
                    entries.push(entry);
                };

                plays.forEach((play, playIndex) => {
                    const inning = Number(play?.about?.inning) || "";
                    const half = play?.about?.halfInning === "top" ? "表" : "裏";

                    (play?.playEvents ?? []).forEach((event, eventIndex) => {
                        const review = event?.reviewDetails;
                        if (!review) return;

                        const reviewType = String(review?.reviewType ?? "").toUpperCase();
                        if (reviewType !== "MJ") {
                            const replayTeam = getChallengeTeamInfo(data, review?.challengeTeamId);
                            const target = getReplayTargetData(play);
                            const finalRuling = getReplayFinalRuling(target, play);
                            appendEntry({
                                inning,
                                half,
                                batter: "—",
                                pitchNumber: "—",
                                type: "Replay",
                                team: replayTeam.code,
                                challenger: getReplayPlayLabel(target, play),
                                target,
                                targetText: review?.isOverturned
                                    ? getOppositeReplayRuling(finalRuling)
                                    : finalRuling,
                                resultText: finalRuling,
                                playIndex,
                                eventIndex
                            });
                            return;
                        }

                        const team = getChallengeTeamInfo(data, review?.challengeTeamId);
                        const role = getAbsChallengerRole(data, play, review);
                        const target = getAbsTargetData(event, review);
                        appendEntry({
                            inning,
                            half,
                            batter: getAbsBatterText(data, play),
                            pitchNumber: getAbsPitchNumberText(play, event, eventIndex),
                            type: "ABS",
                            team: team.code,
                            challenger: role || "—",
                            target,
                            targetText: target.originalCall,
                            resultText: target.finalCall,
                            playIndex,
                            eventIndex
                        });
                    });

                    const review = play?.reviewDetails;
                    if (!review || String(review?.reviewType ?? "").toUpperCase() === "MJ") return;

                    const team = getChallengeTeamInfo(data, review?.challengeTeamId);
                    const target = getReplayTargetData(play);
                    const finalRuling = getReplayFinalRuling(target, play);
                    appendEntry({
                        inning,
                        half,
                        batter: "—",
                        pitchNumber: "—",
                        type: "Replay",
                        team: team.code,
                        challenger: getReplayPlayLabel(target, play),
                        target,
                        targetText: review?.isOverturned
                            ? getOppositeReplayRuling(finalRuling)
                            : finalRuling,
                        resultText: finalRuling,
                        playIndex,
                        eventIndex: Number.MAX_SAFE_INTEGER
                    });
                });

                return entries.sort((left, right) =>
                    left.playIndex - right.playIndex || left.eventIndex - right.eventIndex
                );
            };

            const buildAbsChallengeTable = (data) => {

            const buildScoreHeaderArea = (data) => {

            const buildSheetMeta = (data) => {

            const createPlayerRow = (side, order) => {

            };


            const ROMAN_OUTS = ["", "Ⅰ", "Ⅱ", "Ⅲ"];

            const assignOutNumbers = (play, batterId) => {
                const startingOuts = Number(play?.about?.startOuts) || 0;
                const entries = (play?.runners ?? [])
                    .map((runner, sourceIndex) => ({
                        runner,
                        sourceIndex,
                        explicitOutNumber: Number(runner?.movement?.outNumber) || 0,
                        playIndex: Number(runner?.details?.playIndex)
                    }))
                    .filter(({ runner }) => Boolean(runner?.movement?.isOut));
                const endingOuts = Math.min(
                    3,
                    Math.max(startingOuts + entries.length, Number(play?.count?.outs) || 0)
                );
                const isGroundMultiOut = entries.length > 1 && (
                    String(play?.result?.eventType ?? "").toLowerCase().includes("ground") ||
                    String(play?.result?.description ?? "").toLowerCase().includes("ground")
                );

                entries.sort((left, right) => {
                    const leftExplicit = left.explicitOutNumber;
                    const rightExplicit = right.explicitOutNumber;
                    if (leftExplicit && rightExplicit && leftExplicit !== rightExplicit) {
                        return leftExplicit - rightExplicit;
                    }
                    if (Number.isFinite(left.playIndex) && Number.isFinite(right.playIndex) && left.playIndex !== right.playIndex) {
                        return left.playIndex - right.playIndex;
                    }

                    const leftIsBatter = Number(left.runner?.details?.runner?.id) === Number(batterId);
                    const rightIsBatter = Number(right.runner?.details?.runner?.id) === Number(batterId);
                    if (leftIsBatter !== rightIsBatter) {
                        return isGroundMultiOut
                            ? Number(leftIsBatter) - Number(rightIsBatter)
                            : Number(rightIsBatter) - Number(leftIsBatter);
                    }
                    return left.sourceIndex - right.sourceIndex;
                });

                const availableNumbers = [];
                for (let outNumber = startingOuts + 1; outNumber <= Math.min(3, endingOuts); outNumber += 1) {
                    availableNumbers.push(outNumber);
                }

                const assignedNumbers = new Map();
                const usedNumbers = new Set();
                entries.forEach(({ runner, explicitOutNumber }) => {
                    const isValidExplicit = explicitOutNumber > startingOuts &&
                        explicitOutNumber <= Math.min(3, endingOuts) &&
                        !usedNumbers.has(explicitOutNumber);
                    if (!isValidExplicit) return;
                    assignedNumbers.set(runner, explicitOutNumber);
                    usedNumbers.add(explicitOutNumber);
                });
                entries.forEach(({ runner }) => {
                    if (assignedNumbers.has(runner)) return;
                    const outNumber = availableNumbers.find((number) => !usedNumbers.has(number));
                    if (!outNumber) return;
                    assignedNumbers.set(runner, outNumber);
                    usedNumbers.add(outNumber);
                });
                return assignedNumbers;
            };

            const normalizeBase = (base) => {
                const value = String(base ?? "").toLowerCase();
                if (["home", "home_plate"].includes(value)) return "home";
                if (["1b", "first", "first_base"].includes(value)) return "1B";
                if (["2b", "second", "second_base"].includes(value)) return "2B";
                if (["3b", "third", "third_base"].includes(value)) return "3B";
                if (["score", "home", "home_plate"].includes(value)) return "score";
                return value;
            };

            const getBattingSlot = (side, playerId) => {
                const slots = state?.[side]?.players ?? [];
                for (let index = 0; index < slots.length; index += 1) {
                    if (slots[index].some((player) => Number(player?.person?.id) === Number(playerId))) {
                        return index + 1;
                    }
                }
                return null;
            };

            const getDescriptionFieldNumber = (play) => {
                const text = String(play?.result?.description ?? "").toLowerCase();
                const checks = [
                    [/pitcher|to the mound|back to the mound/, "1"],
                    [/catcher/, "2"],
                    [/first baseman|first base side/, "3"],
                    [/second baseman|second base side/, "4"],
                    [/third baseman|third base side/, "5"],
                    [/shortstop/, "6"],
                    [/left fielder|to left field|into left field|down the left field line/, "7"],
                    [/center fielder|to center field|into center field/, "8"],
                    [/right fielder|to right field|into right field|down the right field line/, "9"]
                ];
                return checks.find(([pattern]) => pattern.test(text))?.[1] ?? "";
            };

            const getFieldNumber = (play) => {
                const described = getDescriptionFieldNumber(play);
                if (described) return described;

                const credits = play?.credits ?? [];
                const fielder = credits.find((credit) =>
                    ["fielded_ball", "putout", "assist"].includes(String(credit?.credit).toLowerCase())
                );
                const credited = String(fielder?.position?.code ?? fielder?.position?.abbreviation ?? "").replace(/\D/g, "");
                if (credited) return credited;

                const location = String(play?.hitData?.location ?? "");
                const map = {
                    "1": "7", "2": "7", "3": "8", "4": "9",
                    "5": "5", "6": "6", "7": "6", "8": "4", "9": "3",
                    "13": "5", "14": "6", "15": "4", "16": "3",
                    "21": "7", "22": "8", "23": "9",
                    "51": "7", "52": "8", "53": "9",
                    "55": "7", "56": "8", "57": "9",
                    "58": "7", "59": "8", "60": "9"
                };
                return map[location] ?? "";
            };

            const FIELDING_POSITION_NUMBERS = Object.freeze({
                pitcher: "1",
                catcher: "2",
                "first baseman": "3",
                "second baseman": "4",
                "third baseman": "5",
                shortstop: "6",
                "left fielder": "7",
                "center fielder": "8",
                "right fielder": "9"
            });

            const OUT_BASE_LETTERS = Object.freeze({
                "1B": "A",
                "2B": "B",
                "3B": "C",
                home: "D",
                score: "D"
            });

            const uniqueConsecutive = (values) =>
                values.filter((value, index) => index === 0 || value !== values[index - 1]);

            const getDescriptionFieldingNumbers = (description) => {
                const pattern = /\b(first baseman|second baseman|third baseman|left fielder|center fielder|right fielder|pitcher|catcher|shortstop)\b/gi;
                const numbers = [...String(description ?? "").matchAll(pattern)]
                    .map((match) => FIELDING_POSITION_NUMBERS[match[1].toLowerCase()])
                    .filter(Boolean);
                return uniqueConsecutive(numbers);
            };

            const getCreditFieldingNumbers = (credits) => {
                const relevant = (credits ?? []).filter((credit) => {
                    const type = String(credit?.credit ?? "").toLowerCase();
                    return type.includes("assist") || type.includes("putout");
                });
                const ordered = [
                    ...relevant.filter((credit) => String(credit?.credit ?? "").toLowerCase().includes("assist")),
                    ...relevant.filter((credit) => String(credit?.credit ?? "").toLowerCase().includes("putout"))
                ];
                return uniqueConsecutive(
                    ordered
                        .map((credit) => String(credit?.position?.code ?? "").replace(/\D/g, ""))
                        .filter(Boolean)
                );
            };

            const getRunnerEventDescription = (play, runner) => {
                const playIndex = Number(runner?.details?.playIndex);
                const eventDetails = Number.isInteger(playIndex)
                    ? play?.playEvents?.[playIndex]?.details
                    : null;
                const eventDescription = eventDetails?.eventType
                    ? eventDetails?.description
                    : "";
                return String(eventDescription || play?.result?.description || "");
            };

            const getFieldingNumbers = (play, description, credits = []) => {
                const described = getDescriptionFieldingNumbers(description);
                if (described.length) return described;

                const credited = getCreditFieldingNumbers(credits.length ? credits : play?.credits);
                if (credited.length) return credited;

                const fallback = getFieldNumber(play);
                return fallback ? [fallback] : [];
            };

            const getOutBaseLetter = (runner) => {
                const base = normalizeBase(runner?.movement?.outBase);
                return OUT_BASE_LETTERS[base] ?? "";
            };

            const getRunnerFieldingResult = (play, runner, batterId) => {
                if (!runner?.movement?.isOut) return "";

                const mainDescription = String(play?.result?.description ?? "");
                const description = getRunnerEventDescription(play, runner);
                const usesRunnerEvent = description !== mainDescription;
                const playIndex = Number(runner?.details?.playIndex);
                const eventCredits = Number.isInteger(playIndex)
                    ? play?.playEvents?.[playIndex]?.credits ?? []
                    : [];
                const numbers = getFieldingNumbers(play, description, eventCredits);
                if (!numbers.length) return "";

                const runnerEventType = String(runner?.details?.eventType ?? "").toLowerCase();
                const playEventType = String(play?.result?.eventType ?? "").toLowerCase();
                const lowerDescription = description.toLowerCase();
                const isBatter = Number(runner?.details?.runner?.id) === Number(batterId);
                const isForceOut = runnerEventType.includes("force_out") ||
                    runnerEventType.includes("grounded_into_double_play") ||
                    runnerEventType.includes("triple_play") ||
                    playEventType === "force_out" ||
                    playEventType === "triple_play" ||
                    lowerDescription.includes("force out");
                const isTagOut = !isForceOut && (
                    /caught_stealing|pickoff|tag_out/.test(runnerEventType) ||
                    /caught stealing|picked off|tagged out|tag play/.test(lowerDescription) ||
                    (!isBatter && Boolean(runner?.movement?.originBase))
                );

                const relatedOuts = usesRunnerEvent
                    ? [runner]
                    : (play?.runners ?? [])
                        .filter((candidate) => candidate?.movement?.isOut)
                        .sort((left, right) =>
                            (Number(left?.movement?.outNumber) || 0) -
                            (Number(right?.movement?.outNumber) || 0)
                        );
                const runnerIndex = Math.max(0, relatedOuts.indexOf(runner));
                const terminalIndex = Math.min(
                    numbers.length - 1,
                    Math.max(0, numbers.length - relatedOuts.length + runnerIndex)
                );
                const route = numbers.slice(0, terminalIndex + 1);
                const suffixes = route.map(() => "");

                if (isTagOut) {
                    suffixes[suffixes.length - 1] = "TO";
                } else if (
                    isForceOut &&
                    !isBatter &&
                    terminalIndex === numbers.length - 1
                ) {
                    suffixes[suffixes.length - 1] = getOutBaseLetter(runner);
                } else if (
                    isBatter &&
                    route.length === 1 &&
                    lowerDescription.includes("ground")
                ) {
                    suffixes[0] = getOutBaseLetter(runner) || "A";
                }

                return route
                    .map((number, index) => `${number}${suffixes[index]}`)
                    .join("-");
            };

            const getPrimaryFieldingResult = (play, batterId) => {
                const description = String(play?.result?.description ?? "");
                const numbers = getFieldingNumbers(play, description);
                if (!numbers.length) return "";

                const outRunners = (play?.runners ?? [])
                    .filter((runner) => runner?.movement?.isOut)
                    .filter((runner) => getRunnerEventDescription(play, runner) === description)
                    .sort((left, right) =>
                        (Number(left?.movement?.outNumber) || 0) -
                        (Number(right?.movement?.outNumber) || 0)
                    );
                if (!outRunners.length) return numbers.join("-");

                const suffixes = numbers.map(() => "");
                outRunners.forEach((runner, runnerIndex) => {
                    const terminalIndex = Math.min(
                        numbers.length - 1,
                        Math.max(0, numbers.length - outRunners.length + runnerIndex)
                    );
                    const runnerEventType = String(runner?.details?.eventType ?? "").toLowerCase();
                    const playEventType = String(play?.result?.eventType ?? "").toLowerCase();
                    const lowerDescription = description.toLowerCase();
                    const isBatter = Number(runner?.details?.runner?.id) === Number(batterId);
                    const isForceOut = runnerEventType.includes("force_out") ||
                        runnerEventType.includes("grounded_into_double_play") ||
                        runnerEventType.includes("triple_play") ||
                        playEventType === "force_out" ||
                        playEventType === "triple_play" ||
                        lowerDescription.includes("force out");
                    const isTagOut = !isForceOut && !isBatter && Boolean(runner?.movement?.originBase);

                    if (isTagOut) {
                        suffixes[terminalIndex] = "TO";
                    } else if (
                        isForceOut &&
                        !isBatter &&
                        terminalIndex === numbers.length - 1
                    ) {
                        suffixes[terminalIndex] = getOutBaseLetter(runner);
                    } else if (
                        isBatter &&
                        numbers.length === 1 &&
                        lowerDescription.includes("ground")
                    ) {
                        suffixes[terminalIndex] = getOutBaseLetter(runner) || "A";
                    }
                });

                return numbers
                    .map((number, index) => `${number}${suffixes[index]}`)
                    .join("-");
            };

            const getBattedBallShape = (play) => {
                const trajectory = String(play?.hitData?.trajectory ?? "").toLowerCase();
                const description = String(play?.result?.description ?? "").toLowerCase();
                if (trajectory.includes("bunt") || description.includes("bunt")) return "bunt";
                if (trajectory.includes("ground") || description.includes("grounds") || description.includes("groundout")) return "ground";
                if (trajectory.includes("line") || description.includes("lines out") || description.includes("lineout")) return "line";
                if (trajectory.includes("popup") || description.includes("pops out") || description.includes("pop out")) return "pop";
                if (trajectory.includes("fly") || description.includes("flies out") || description.includes("flyout")) return "fly";
                return "";
            };

            const getHitNotation = (play, field) => field || "";

            const getSeasonHomeRunNumber = (play) => {
                const description = String(play?.result?.description ?? "");
                const match = description.match(/\b(?:homers?|home runs?|grand slams?)\s*\((\d+)\)/i);
                return match?.[1] ?? "";
            };

            const PLAY_TEMPLATES = Object.freeze({
                strikeout: { category: "out", notation: "K" },
                swinging_strikeout: { category: "out", notation: "Ks" },
                walk: { category: "reach", notation: "B" },
                intentional_walk: { category: "reach", notation: "DIB" },
                hit_by_pitch: { category: "reach", notation: "HBP" },
                single: { category: "hit" },
                double: { category: "hit" },
                triple: { category: "hit" },
                home_run: { category: "hit" },
                groundout: { category: "out", shape: "ground" },
                flyout: { category: "out", shape: "fly" },
                popout: { category: "out", shape: "fly" },
                lineout: { category: "out", shape: "line" },
                sac_fly: { category: "out", shape: "fly", prefix: "F" },
                sac_bunt: { category: "out", shape: "bunt" },
                field_error: { category: "reach" },
                fielders_choice: { category: "reach" },
                catcher_interference: { category: "reach", notation: "CI" },
                runner_interference: { category: "out", notation: "OI" },
                unknown_out: { category: "out" }
            });

            const resolveTemplateId = (play) => {
                const eventType = String(play?.result?.eventType ?? "").toLowerCase();
                const event = String(play?.result?.event ?? "").toLowerCase();
                const description = String(play?.result?.description ?? "").toLowerCase();

                if (eventType === "strikeout" || event.includes("strikeout")) {
                    return description.includes("swinging") ? "swinging_strikeout" : "strikeout";
                }
                if (["walk", "base_on_balls"].includes(eventType) || event === "walk") return "walk";
                if (["intent_walk", "intentional_walk"].includes(eventType) || event.includes("intentional walk")) return "intentional_walk";
                if (eventType === "hit_by_pitch" || event.includes("hit by pitch")) return "hit_by_pitch";
                if (["single", "double", "triple", "home_run"].includes(eventType)) return eventType;
                if (eventType === "field_error" || event.includes("error")) return "field_error";
                if (["fielders_choice", "fielders_choice_out"].includes(eventType) || event.includes("fielder's choice")) return "fielders_choice";
                if (["groundout", "force_out", "double_play", "grounded_into_double_play", "triple_play"].includes(eventType) || event.includes("groundout") || event.includes("triple play")) return "groundout";
                if (eventType === "field_out") {
                    const shape = getBattedBallShape(play);
                    if (shape === "ground") return "groundout";
                    if (shape === "line") return "lineout";
                    if (shape === "pop") return "popout";
                    return "flyout";
                }
                if (eventType === "flyout" || event.includes("flyout")) return "flyout";
                if (eventType === "pop_out" || event.includes("pop out")) return "popout";
                if (eventType === "lineout" || event.includes("lineout")) return "lineout";
                if (eventType === "sac_fly" || event.includes("sac fly")) return "sac_fly";
                if (["sac_bunt", "sacrifice_bunt"].includes(eventType) || event.includes("sac bunt")) return "sac_bunt";
                if (eventType.includes("catcher_interf")) return "catcher_interference";
                if (eventType.includes("runner_interf") || event.includes("interference")) return "runner_interference";
                return "unknown_out";
            };

            const getPlayDisplay = (play, batterId) => {
                const templateId = resolveTemplateId(play);
                const template = PLAY_TEMPLATES[templateId] ?? PLAY_TEMPLATES.unknown_out;
                const description = String(play?.result?.description ?? "").toLowerCase();
                const field = getFieldNumber(play);
                const fieldingResult = getPrimaryFieldingResult(play, batterId);
                let notation = template.notation ?? "";

                if (["single", "double", "triple", "home_run"].includes(templateId)) {
                    notation = getHitNotation(play, field);
                } else if (templateId === "field_error") {
                    notation = `E${field || "?"}${description.includes("throwing error") ? "t" : "f"}`;
                } else if (templateId === "fielders_choice") {
                    notation = `Fc${field || ""}`;
                } else if (["groundout", "sac_bunt"].includes(templateId)) {
                    notation = fieldingResult || field;
                } else if (["flyout", "popout", "lineout"].includes(templateId)) {
                    notation = field;
                } else if (templateId === "sac_fly") {
                    notation = field;
                }

                return {
                    templateId,
                    notation,
                    category: template.category,
                    isHit: template.category === "hit",
                    homeRunNumber: templateId === "home_run" ? getSeasonHomeRunNumber(play) : "",
                    extra: template.extra ?? "",
                    shape: template.shape ?? getBattedBallShape(play)
                };
            };

            const addPathSegments = (record, origin, end) => {
                const order = ["home", "1B", "2B", "3B", "score"];
                let from = normalizeBase(origin);
                let to = normalizeBase(end);
                if (to === "home") to = "score";
                let startIndex = order.indexOf(from);
                let endIndex = order.indexOf(to);
                if (startIndex < 0 || endIndex < 0 || endIndex <= startIndex) return;
                for (let index = startIndex; index < endIndex; index += 1) {
                    const key = `${order[index]}-${order[index + 1]}`;
                    if (!record.segments.includes(key)) record.segments.push(key);
                }
            };

            const getAutomaticRunnerPlacements = (data, plays) => {
                const gameType = String(
                    data?.gameData?.game?.type ?? data?.gameData?.game?.gameType ?? ""
                ).toUpperCase();
                if (gameType !== "R") return new Map();

                const placements = new Map();
                const previousCompletedBatter = { away: null, home: null };
                const visitedHalfInnings = new Set();

                plays.forEach((play) => {
                    const side = play?.about?.halfInning === "top" ? "away" : "home";
                    const inning = Number(play?.about?.inning);
                    const halfKey = `${side}-${inning}`;
                    if (inning >= 10 && !visitedHalfInnings.has(halfKey)) {
                        visitedHalfInnings.add(halfKey);
                        const prePitchEvents = [];
                        for (const event of play?.playEvents ?? []) {
                            if (event?.isPitch || event?.type === "pitch") break;
                            prePitchEvents.push(event);
                        }

                        const placedEvent = prePitchEvents.find((event) => {
                            const eventType = String(event?.details?.eventType ?? "").toLowerCase();
                            const description = String(event?.details?.description ?? "").toLowerCase();
                            return eventType.includes("runner_placed") ||
                                /automatic runner|extra-inning runner|placed on second/.test(description);
                        });
                        const movementRunner = (play?.runners ?? []).find((runner) =>
                            normalizeBase(runner?.movement?.originBase || runner?.movement?.start) === "2B"
                        );
                        const baseRunner = play?.matchup?.preOnSecond || play?.matchup?.postOnSecond;
                        const pinchRunner = [...prePitchEvents].reverse().find((event) => {
                            const eventType = String(event?.details?.eventType ?? "").toLowerCase();
                            const description = String(event?.details?.description ?? "").toLowerCase();
                            return eventType === "offensive_substitution" &&
                                /pinch-runner|pinch runner/.test(description);
                        });
                        const runnerId = Number(
                            pinchRunner?.player?.id ||
                            placedEvent?.player?.id ||
                            movementRunner?.details?.runner?.id ||
                            baseRunner?.id ||
                            previousCompletedBatter[side]
                        );
                        if (runnerId) placements.set(halfKey, runnerId);
                    }

                    const batterId = Number(play?.matchup?.batter?.id);
                    if (batterId) previousCompletedBatter[side] = batterId;
                });
                return placements;
            };

            const buildPlateAppearanceRecords = () => {
                const records = [];
                const activeRunner = new Map();
                const plays = state.gameData?.liveData?.plays?.allPlays ?? [];
                const automaticRunners = getAutomaticRunnerPlacements(state.gameData, plays);
                const renderedAutomaticRunners = new Set();
                const plateAppearanceOccurrences = new Map();

                plays.forEach((play, playIndex) => {
                    const side = play?.about?.halfInning === "top" ? "away" : "home";
                    const batterId = play?.matchup?.batter?.id;
                    const order = getBattingSlot(side, batterId);
                    const inning = Number(play?.about?.inning);
                    if (!order || !inning) return;

                    const halfKey = `${side}-${inning}`;
                    const occurrenceKey = `${side}-${inning}-${order}`;
                    const inningOccurrence = (plateAppearanceOccurrences.get(occurrenceKey) ?? 0) + 1;
                    plateAppearanceOccurrences.set(occurrenceKey, inningOccurrence);
                    const automaticRunnerId = automaticRunners.get(halfKey);
                    if (automaticRunnerId && !renderedAutomaticRunners.has(halfKey)) {
                        const automaticRunnerOrder = getBattingSlot(side, automaticRunnerId);
                        if (automaticRunnerOrder) {
                            const automaticRunnerRecord = {
                                playIndex: playIndex - 0.5,
                                atBatIndex: null,
                                side,
                                inning,
                                inningOccurrence: 1,
                                order: automaticRunnerOrder,
                                batterId: automaticRunnerId,
                                templateId: "extra_inning_runner",
                                notation: "E",
                                category: "other",
                                isHit: false,
                                homeRunNumber: "",
                                extra: "",
                                outResult: "",
                                shape: "",
                                segments: [],
                                runnerAdvancePath: "",
                                ghostRunner: true,
                                toSecond: "",
                                toThird: "",
                                toHome: "",
                                outAtSecond: "",
                                outAtThird: "",
                                outAtHome: "",
                                centerMark: "",
                                rbi: 0,
                                inningEnd: false
                            };
                            records.push(automaticRunnerRecord);
                            activeRunner.set(Number(automaticRunnerId), automaticRunnerRecord);
                        }
                        renderedAutomaticRunners.add(halfKey);
                    }

                    const display = getPlayDisplay(play, batterId);
                    const record = {
                        playIndex,
                        atBatIndex: Number.isInteger(Number(play?.about?.atBatIndex))
                            ? Number(play.about.atBatIndex)
                            : null,
                        side,
                        inning,
                        inningOccurrence,
                        order,
                        batterId,
                        templateId: display.templateId,
                        notation: display.notation,
                        category: display.category,
                        isHit: display.isHit,
                        homeRunNumber: display.homeRunNumber,
                        extra: display.extra,
                        outResult: "",
                        shape: display.shape,
                        segments: [],
                        runnerAdvancePath: "",
                        toSecond: "",
                        toThird: "",
                        toHome: "",
                        outAtSecond: "",
                        outAtThird: "",
                        outAtHome: "",
                        centerMark: "",
                        rbi: Number(play?.result?.rbi) || 0,
                        inningEnd: Boolean(play?.about?.isComplete && Number(play?.count?.outs) === 3)
                    };
                    records.push(record);

                    const runners = play?.runners ?? [];
                    const outNumberByRunner = assignOutNumbers(play, batterId);
                    let batterOutRecorded = false;
                    runners.forEach((runner) => {
                        const runnerId = runner?.details?.runner?.id;
                        const movement = runner?.movement ?? {};
                        const isCurrentBatter = Number(runnerId) === Number(batterId);
                        const runnerOrder = getBattingSlot(side, runnerId);
                        const fallbackTarget = runnerOrder
                            ? [...records].reverse().find((candidate) =>
                                candidate.side === side &&
                                candidate.inning === inning &&
                                candidate.order === runnerOrder
                            )
                            : null;
                        const target = isCurrentBatter
                            ? record
                            : activeRunner.get(Number(runnerId)) || fallbackTarget;
                        if (!target) return;

                        const origin = movement?.originBase || (isCurrentBatter ? "home" : "");
                        const end = movement?.end;

                        // Red path records only the batter-runner's result in this plate appearance.
                        if (target.isHit && isCurrentBatter) addPathSegments(target, origin, end);

                        // Later advances belong to the runner history of the original score cell.
                        if (!isCurrentBatter && origin && end) {
                            const advanceLabel = `（${order}）`;
                            const baseOrder = ["home", "1B", "2B", "3B", "score"];
                            let fromBase = normalizeBase(origin);
                            let toBase = normalizeBase(end);
                            if (toBase === "home") toBase = "score";
                            const fromIndex = baseOrder.indexOf(fromBase);
                            const toIndex = baseOrder.indexOf(toBase);
                            if (fromIndex >= 0 && toIndex > fromIndex) {
                                if (toIndex - fromIndex > 1) {
                                    if (fromIndex < 2 && toIndex > 2) target.toSecond = "";
                                    if (fromIndex < 3 && toIndex > 3) target.toThird = "";
                                    if (fromIndex === 1 && toIndex === 3) {
                                        target.runnerAdvancePath = "second-third";
                                    } else if (fromIndex === 1 && toIndex >= 4) {
                                        target.runnerAdvancePath = "second-third-home";
                                    } else if (fromIndex === 2 && toIndex >= 4) {
                                        target.runnerAdvancePath = "third-home";
                                    }
                                }
                                if (toIndex === 2) target.toSecond = advanceLabel;
                                if (toIndex === 3) target.toThird = advanceLabel;
                                if (toIndex >= 4) target.toHome = advanceLabel;
                            }
                        }

                        if (movement?.isOut) {
                            const outNumber = outNumberByRunner.get(runner);
                            if (outNumber) target.centerMark = ROMAN_OUTS[outNumber];
                            const runnerDescription = getRunnerEventDescription(play, runner);
                            const mainDescription = String(play?.result?.description ?? "");
                            if (!isCurrentBatter) {
                                const runnerFieldingResult = getRunnerFieldingResult(play, runner, batterId);
                                const outBase = normalizeBase(movement?.outBase || movement?.end);
                                if (runnerDescription === mainDescription) {
                                    if (outBase === "2B") target.outAtSecond = runnerFieldingResult;
                                    if (outBase === "3B") target.outAtThird = runnerFieldingResult;
                                    if (["home", "score"].includes(outBase)) target.outAtHome = runnerFieldingResult;
                                } else {
                                    target.outResult = runnerFieldingResult;
                                    target.outResultAtBatIndex = Number.isInteger(Number(play?.about?.atBatIndex))
                                        ? Number(play.about.atBatIndex)
                                        : null;
                                }
                            }
                            if (isCurrentBatter) batterOutRecorded = true;
                            activeRunner.delete(Number(runnerId));
                        } else if (["score", "home", "home_plate"].includes(String(end).toLowerCase())) {
                            target.centerMark = runner?.details?.earned === false ? "○" : "●";
                            activeRunner.delete(Number(runnerId));
                        } else if (end) {
                            activeRunner.set(Number(runnerId), target);
                        }
                    });

                    if (!batterOutRecorded && !runners.some((runner) => Number(runner?.details?.runner?.id) === Number(batterId))) {
                        const isOut = Boolean(play?.result?.isOut) || Number(play?.count?.outs) > Number(play?.about?.startOuts ?? 0);
                        if (isOut) {
                            record.centerMark = ROMAN_OUTS[Math.max(1, Math.min(3, Number(play?.count?.outs) || 1))];
                        }
                    }

                    const halfInningEnded = Boolean(
                        play?.about?.isComplete && Number(play?.count?.outs) === 3
                    );
                    if (halfInningEnded) {
                        const thirdOutRunner = runners.find((runner) =>
                            outNumberByRunner.get(runner) === 3
                        ) || [...runners].reverse().find((runner) => runner?.movement?.isOut);
                        const thirdOutEventType = String(
                            thirdOutRunner?.details?.eventType ?? play?.result?.eventType ?? ""
                        ).toLowerCase();
                        const thirdOutDescription = getRunnerEventDescription(
                            play,
                            thirdOutRunner
                        ).toLowerCase();
                        const thirdOutIsForce = thirdOutEventType.includes("force_out") ||
                            thirdOutEventType.includes("grounded_into_double_play") ||
                            thirdOutEventType.includes("triple_play") ||
                            thirdOutDescription.includes("force out");

                        if (thirdOutIsForce) {
                            activeRunner.delete(Number(batterId));
                            activeRunner.delete(Number(thirdOutRunner?.details?.runner?.id));
                        }
                        [...activeRunner.entries()].forEach(([runnerId, runnerRecord]) => {
                            if (runnerRecord.side !== side || runnerRecord.inning !== inning) return;
                            if (!runnerRecord.centerMark) runnerRecord.centerMark = "ℓ";
                            activeRunner.delete(runnerId);
                        });
                    }
                });

                const byHalfInning = new Map();
                records.forEach((record) => {
                    const key = `${record.side}-${record.inning}`;
                    if (!byHalfInning.has(key)) byHalfInning.set(key, []);
                    byHalfInning.get(key).push(record);
                });
                byHalfInning.forEach((halfRecords) => {
                    const last = halfRecords[halfRecords.length - 1];
                    if (last) last.inningEnd = true;
                });

                return records;
            };

            const getRoundedAdvancePath = (segments) => {
                const set = new Set(segments);
                const has1 = set.has("home-1B");
                const has2 = set.has("1B-2B");
                const has3 = set.has("2B-3B");
                const has4 = set.has("3B-score") || set.has("3B-home");
                const r = 3.2;

                // SVG coordinates trace just outside the fixed gray diamond.
                if (has1) {
                    let d = "M21.5 42 L38.3 25.2";
                    if (has2) d += " Q42 21.5 38.3 17.8 L25.2 4.7";
                    if (has3) d += " Q21.5 1 17.8 4.7 L4.7 17.8";
                    if (has4) d += " Q1 21.5 4.7 25.2 L21.5 42";
                    return d;
                }
                if (has2) {
                    let d = "M42 21.5 L38.3 17.8 L25.2 4.7";
                    if (has3) d += " Q21.5 1 17.8 4.7 L4.7 17.8";
                    if (has4) d += " Q1 21.5 4.7 25.2 L21.5 42";
                    return d;
                }
                if (has3) {
                    let d = "M21.5 1 L17.8 4.7 L4.7 17.8";
                    if (has4) d += " Q1 21.5 4.7 25.2 L21.5 42";
                    return d;
                }
                if (has4) return "M1 21.5 L4.7 25.2 L21.5 42";
                return "";
            };

            const createAdvanceSvg = (segments, className = "advance-svg") => {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "-1 -1 45 45");
                svg.classList.add(className);
                const d = getRoundedAdvancePath(segments);
                if (d) {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", d);
                    svg.append(path);
                }
                return svg;
            };

            let ghostRunnerArrowId = 0;
            const createGhostRunnerSvg = () => {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "-1 -1 45 45");
                svg.classList.add("ghost-runner-svg");
                const markerId = `ghost-runner-arrow-${ghostRunnerArrowId += 1}`;
                const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
                const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
                marker.setAttribute("id", markerId);
                marker.setAttribute("viewBox", "0 0 6 6");
                marker.setAttribute("refX", "5");
                marker.setAttribute("refY", "3");
                marker.setAttribute("markerWidth", "5");
                marker.setAttribute("markerHeight", "5");
                marker.setAttribute("orient", "auto");
                const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
                arrow.setAttribute("d", "M0 0 L6 3 L0 6 Z");
                marker.append(arrow);
                defs.append(marker);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", "M21.5 42 L21.5 5");
                path.setAttribute("marker-end", `url(#${markerId})`);
                svg.append(defs, path);
                return svg;
            };

            let runnerHistoryArrowId = 0;
            const createRunnerHistorySvg = (type) => {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "0 0 61 61");
                svg.classList.add("runner-history-svg", `runner-history-${type}`);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", type === "second-third"
                    ? "M52 52 L52 9 L9 9"
                    : type === "second-third-home"
                        ? "M52 52 L52 9 L9 9 L9 52"
                        : "M52 9 L9 9 L9 52");
                const markerId = `runner-history-arrow-${runnerHistoryArrowId += 1}`;
                const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
                const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
                marker.setAttribute("id", markerId);
                marker.setAttribute("viewBox", "0 0 6 6");
                marker.setAttribute("refX", "5");
                marker.setAttribute("refY", "3");
                marker.setAttribute("markerWidth", "8");
                marker.setAttribute("markerHeight", "8");
                marker.setAttribute("orient", "auto");
                const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
                arrow.setAttribute("d", "M0 0 L6 3 L0 6 Z");
                marker.append(arrow);
                defs.append(marker);
                svg.append(defs);
                path.setAttribute("marker-end", `url(#${markerId})`);
                svg.append(path);
                return svg;
            };

            const createTemplateSvg = (shape) => {
                if (!shape || shape === "ground") return null;
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "0 0 18 12");
                svg.classList.add("play-template-svg");
                const addPath = (d) => {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", d);
                    svg.append(path);
                };
                if (shape === "fly") addPath("M2 9 Q9 1 16 9");
                if (shape === "pop") addPath("M3 9 Q9 0 15 9");
                if (shape === "line") addPath("M2 6 L16 6");
                if (shape === "bunt") addPath("M9 1 L16 6 L9 11 L2 6 Z");
                return svg;
            };

            const renderPlateAppearance = (record) => {
                const card = createElement("div", `play-card template-${record.templateId}`);
                const stage = createElement("div", "diamond-stage");
                const anchorNames = ["topLeft", "topRight", "center", "bottomLeft", "bottomRight"];
                const slots = Object.fromEntries(anchorNames.map((name) => [
                    name,
                    createElement("div", `score-anchor ${name.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`)}`)
                ]));

                stage.append(createElement("div", "diamond"));
                if (record.isHit && record.segments.length) stage.append(createAdvanceSvg(record.segments));
                if (record.ghostRunner) stage.append(createGhostRunnerSvg());
                if (record.rbi > 0) {
                    stage.append(createElement("div", "score-symbol play-rbi", String(record.rbi)));
                }
                card.append(
                    stage,
                    ...anchorNames.map((name) => slots[name])
                );
                if (record.runnerAdvancePath) {
                    card.append(createRunnerHistorySvg(record.runnerAdvancePath));
                }

                if (record.notation || record.outResult) {
                    const notationStack = createElement("div", "play-notation-stack");
                    if (record.notation) {
                        const templateSvg = createTemplateSvg(record.shape);
                        if (templateSvg) notationStack.append(templateSvg);
                        const longClass = record.notation.length > 3 ? " long-result" : "";
                        const strikeoutClass = ["strikeout", "swinging_strikeout"].includes(record.templateId)
                            ? " strikeout-result"
                            : "";
                        notationStack.append(createGamedayAtBatResult(
                            record.notation,
                            `score-symbol play-result ${record.category}-result${strikeoutClass}${longClass}`,
                            record.atBatIndex
                        ));
                    }
                    if (record.outResult && record.outResult !== record.notation) {
                        const longClass = record.outResult.length > 3 ? " long-result" : "";
                        notationStack.append(createGamedayAtBatResult(
                            record.outResult,
                            `score-symbol play-result runner-out-result${longClass}`,
                            record.outResultAtBatIndex
                        ));
                    }
                    slots.bottomRight.append(notationStack);
                }

                if (record.extra) slots.bottomLeft.append(createElement("div", "score-symbol play-extra hit-result", record.extra));
                if (record.homeRunNumber) {
                    slots.bottomLeft.append(
                        createElement("div", "score-symbol home-run-count", `${record.homeRunNumber}号`)
                    );
                }
                if (record.centerMark) {
                    const centerClass = ["●", "○"].includes(record.centerMark)
                        ? "score-symbol play-center-mark scored"
                        : record.centerMark === "ℓ"
                            ? "score-symbol play-center-mark stranded"
                        : "score-symbol play-center-mark out-number";
                    slots.center.append(createElement("div", centerClass, record.centerMark));
                }
                if (record.toSecond) slots.topRight.append(createElement("div", "score-symbol runner-note to-second", record.toSecond));
                if (record.toThird) slots.topLeft.append(createElement("div", "score-symbol runner-note to-third", record.toThird));
                if (record.toHome) slots.bottomLeft.append(createElement("div", "score-symbol runner-note to-home", record.toHome));
                if (record.outAtSecond) slots.topRight.append(createElement("div", "score-symbol runner-base-out-result", record.outAtSecond));
                if (record.outAtThird) slots.topLeft.append(createElement("div", "score-symbol runner-base-out-result", record.outAtThird));
                if (record.outAtHome) slots.bottomLeft.append(createElement("div", "score-symbol runner-base-out-result", record.outAtHome));
                if (record.inningEnd) {
                    card.classList.add("has-inning-end");
                    card.append(createElement("div", "inning-end-mark"));
                }
                return card;
            };

            const populateScoreGrid = () => {
                const records = buildPlateAppearanceRecords();
                records.forEach((record) => {
                    const selector = `.atbat-cell[data-side="${record.side}"]` +
                        `[data-inning="${record.inning}"]` +
                        `[data-inning-occurrence="${record.inningOccurrence ?? 1}"]` +
                        `[data-order="${record.order}"] .result-box`;
                    const resultBox = dom.awaySheet.querySelector(selector);
                    if (!resultBox) return;
                    resultBox.classList.add("has-play");
                    resultBox.append(renderPlateAppearance(record));
                });
                populateSubstitutionIndicators();
            };

            const getSubstitutionRole = (eventDetails) => {
                const eventType = String(eventDetails?.eventType ?? "").toLowerCase();
                const description = String(eventDetails?.description ?? "").toLowerCase();
                if (eventType === "pitching_substitution") return "pitcher";
                if (eventType === "defensive_substitution") return "defense";
                if (eventType === "offensive_substitution" && description.includes("pinch-hitter")) return "pinch-hitter";
                if (eventType === "offensive_substitution" && description.includes("pinch-runner")) return "pinch-runner";
                return "";
            };

            const getSubstitutionIndicators = () => {
                const indicators = [];
                const seenPlayers = new Set();
                const plays = state.gameData?.liveData?.plays?.allPlays ?? [];
                plays.forEach((play, playIndex) => {
                    const battingSide = play?.about?.halfInning === "top" ? "away" : "home";
                    const fieldingSide = battingSide === "away" ? "home" : "away";
                    const inning = Number(play?.about?.inning);
                    (play?.playEvents ?? []).forEach((event) => {
                        const role = getSubstitutionRole(event?.details);
                        const playerId = Number(event?.player?.id);
                        if (!role || !playerId || seenPlayers.has(playerId)) return;

                        const side = role === "defense" ? fieldingSide : battingSide;
                        const order = role === "pitcher"
                            ? getBattingSlot(battingSide, play?.matchup?.batter?.id)
                            : getBattingSlot(side, playerId);
                        if (!order || !inning) return;
                        const displaySide = role === "pitcher" ? battingSide : side;
                        const priorAppearances = plays.slice(0, playIndex).filter((priorPlay) => {
                            const priorSide = priorPlay?.about?.halfInning === "top" ? "away" : "home";
                            return priorSide === displaySide &&
                                Number(priorPlay?.about?.inning) === inning &&
                                Boolean(priorPlay?.matchup?.batter?.id);
                        }).length;
                        const inningOccurrence = Math.floor(priorAppearances / 9) + 1;

                        const person = state.gameData?.gameData?.players?.[`ID${playerId}`] ?? event?.player ?? {};
                        indicators.push({
                            side: displaySide,
                            teamSide: role === "pitcher" ? fieldingSide : side,
                            inning,
                            inningOccurrence,
                            order,
                            playerId,
                            person,
                            role,
                            name: getPersonName(person)
                        });
                        seenPlayers.add(playerId);
                    });
                });
                return indicators;
            };

            const createSubstitutionIndicator = (items, cell) => {
                const indicator = createElement("div", "substitution-indicator");
                const wave = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                wave.setAttribute("viewBox", "0 0 64 5");
                wave.setAttribute("preserveAspectRatio", "none");
                wave.classList.add("substitution-wave");
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", "M0 2.5 Q4 0 8 2.5 T16 2.5 T24 2.5 T32 2.5 T40 2.5 T48 2.5 T56 2.5 T64 2.5");
                wave.append(path);

                const names = createElement("div", "substitution-names");
                if (items.length > 1) names.classList.add("multiple");
                items.forEach((item) => {
                    const rolePrefix = {
                        pitcher: "P：",
                        "pinch-hitter": "PH：",
                        "pinch-runner": "PR：",
                        defense: ""
                    }[item.role] ?? "";
                    const name = createElement(
                        "span",
                        `substitution-name substitution-${item.role} substitution-${item.teamSide}`
                    );
                    if (rolePrefix) name.append(document.createTextNode(rolePrefix));
                    name.append(createPlayerProfileLink(item.person, item.name));
                    names.append(name);
                });
                indicator.append(wave, names);
                return indicator;
            };

            const populateSubstitutionIndicators = () => {
                const grouped = new Map();
                getSubstitutionIndicators().forEach((item) => {
                    const key = `${item.side}-${item.inning}-${item.inningOccurrence}-${item.order}`;
                    if (!grouped.has(key)) grouped.set(key, []);
                    grouped.get(key).push(item);
                });
                grouped.forEach((items) => {
                    const { side, inning, inningOccurrence, order } = items[0];
                    const cell = dom.awaySheet.querySelector(
                        `.atbat-cell[data-side="${side}"]` +
                        `[data-inning="${inning}"]` +
                        `[data-inning-occurrence="${inningOccurrence}"]` +
                        `[data-order="${order}"]`
                    );
                    if (cell) {
                        const indicator = createSubstitutionIndicator(items, cell);
                        cell.append(indicator);
                        const names = indicator.querySelector(".substitution-names");
                        if (names && names.scrollWidth > names.clientWidth) {
                            names.classList.add("tight");
                        }
                    }
                });
            };

            const buildScoreGrid = (side) => {
                const grid = createElement("section", "score-grid");

                ["打順", "背番号", "名前", "守", "投/打"].forEach((label) => {
                    grid.append(createElement("div", "grid-header", label));
                });

                getInningColumns(side).forEach(({ inning }) => {
                    grid.append(
                        createElement("div", "grid-header", String(inning))
                    );
                });

                statHeaders.forEach((label) => {
                    const header = createElement("div", "grid-header vertical");
                    [...label].forEach((character) => {
                        header.append(createElement("span", "", character));
                    });
                    grid.append(header);
                });

                for (let order = 1; order <= 9; order += 1) {
                    grid.append(createPlayerRow(side, order));
                }

                return grid;
            };

            const PITCHER_ORDER_MARKS = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩"];

            const getPitcherOrderLabel = (pitcherIndex) =>
                pitcherIndex === 0
                    ? "先"
                    : PITCHER_ORDER_MARKS[pitcherIndex] ?? String(pitcherIndex + 1);

            const formatPitcherEntrySituation = (play, outs) => {
                const inning = Number(play?.about?.inning);
                if (!inning) return "";
                const half = play?.about?.halfInning === "top" ? "表" : "裏";
                const outLabel = { 1: "一死", 2: "二死" }[Number(outs)] ?? "";
                return `${inning}${half}${outLabel}`;
            };

            const getPitcherEntrySituation = (side, pitcher, pitcherIndex) => {
                if (pitcherIndex === 0) return "";
                const playerId = Number(pitcher?.person?.id);
                if (!playerId) return "";
                const plays = state.gameData?.liveData?.plays?.allPlays ?? [];

                for (let playIndex = 0; playIndex < plays.length; playIndex += 1) {
                    const play = plays[playIndex];
                    for (const event of play?.playEvents ?? []) {
                        const eventType = String(event?.details?.eventType ?? "").toLowerCase();
                        if (eventType !== "pitching_substitution" ||
                            Number(event?.player?.id) !== playerId) continue;
                        const eventOuts = Number(event?.count?.outs);
                        if (Number.isFinite(eventOuts)) {
                            return formatPitcherEntrySituation(play, eventOuts);
                        }
                        const halfKey = `${play?.about?.inning}-${play?.about?.halfInning}`;
                        let previousPlayOuts = 0;
                        for (let previousIndex = playIndex - 1; previousIndex >= 0; previousIndex -= 1) {
                            const previousPlay = plays[previousIndex];
                            const previousHalfKey = `${previousPlay?.about?.inning}-${previousPlay?.about?.halfInning}`;
                            if (previousHalfKey !== halfKey) break;
                            previousPlayOuts = Number(previousPlay?.count?.outs) || 0;
                            break;
                        }
                        return formatPitcherEntrySituation(play, previousPlayOuts);
                    }
                }

                const previousOuts = new Map();
                for (const play of plays) {
                    const halfKey = `${play?.about?.inning}-${play?.about?.halfInning}`;
                    const battingSide = play?.about?.halfInning === "top" ? "away" : "home";
                    const fieldingSide = battingSide === "away" ? "home" : "away";
                    if (fieldingSide === side &&
                        Number(play?.matchup?.pitcher?.id) === playerId) {
                        return formatPitcherEntrySituation(play, previousOuts.get(halfKey) ?? 0);
                    }
                    previousOuts.set(halfKey, Number(play?.count?.outs) || 0);
                }
                return "";
            };

            const getPitchArmAbbreviation = (pitcher) => {
                const code = String(pitcher?.pitchHand?.code ?? "").toUpperCase();
                if (code === "L") return "LHP";
                if (code === "R") return "RHP";
                return "";
            };

            const buildBenchRows = (side) => {
                const grid = createElement("section", "bench-grid");
                const pitchers = state[side].pitchers;

                const label = createElement("div", "bench-label", "P");
                const list = createElement("div", "bench-pitcher-list");
                const flow = createElement("div", "bench-pitcher-flow");
                pitchers.forEach((pitcher, pitcherIndex) => {
                    const person = pitcher?.person ?? {};
                    const entry = createElement("span", "bench-pitcher-entry");
                    const orderLabel = getPitcherOrderLabel(pitcherIndex);
                    const situation = getPitcherEntrySituation(side, pitcher, pitcherIndex);
                    const timing = `${orderLabel}${situation}`;
                    const number = String(pitcher?.jerseyNumber ?? "").trim();
                    const arm = getPitchArmAbbreviation(pitcher);
                    const prefix = [timing, number].filter(Boolean).join(" ");
                    if (prefix) entry.append(document.createTextNode(`${prefix} `));
                    const pitcherNameLink = createPlayerProfileLink(person);
                    pitcherNameLink.classList.add("bench-pitcher-name");
                    entry.append(pitcherNameLink);
                    if (arm) entry.append(document.createTextNode(`（${arm}）`));
                    flow.append(entry);
                });
                list.append(flow);
                grid.append(label, list);

                return grid;
            };

            const buildSummaryRows = (side) => {
                const grid = createElement("section", "summary-grid");

                ["安打｜四球｜三振", "得点｜残塁", "投球数｜失策"].forEach(
                    (label) => {
                        grid.append(
                            createElement(
                                "div",
                                "summary-cell summary-label",
                                label
                            )
                        );

                        for (let column = 0; column < getInningColumns(side).length; column += 1) {
                            grid.append(createElement("div", "summary-cell"));
                        }

                        for (
                            let index = 0;
                            index < statHeaders.length;
                            index += 1
                        ) {
                            grid.append(createElement("div", "summary-cell"));
                        }
                    }
                );

                return grid;
            };

            const buildPitchingTable = (side) => {
                const box = createElement("section", "table-box");
                box.append(createElement("div", "table-title", `投手成績　${state[side].name}`));

                const wrap = createElement("div", "pitching-table-wrap");
                const table = createElement("table", "pitching-table");
                const thead = document.createElement("thead");
                const headRow = document.createElement("tr");

                pitchingHeaders.forEach((label, index) => {
                    const th = createElement("th", "", label);
                    if (index === 0) th.className = "pitcher-column";
                    else if (index === 1) th.className = "pitch-count-column";
                    else th.className = "stat-column";
                    headRow.append(th);
                });

                thead.append(headRow);
                table.append(thead);

                const tbody = document.createElement("tbody");
                const rowCount = Math.max(
                    4,
                    Math.min(8, state.away.pitchers.length),
                    Math.min(8, state.home.pitchers.length)
                );
                const pitchers = state[side].pitchers.slice(0, rowCount);
                while (pitchers.length < rowCount) pitchers.push(null);

                pitchers.forEach((pitcher) => {
                    const row = document.createElement("tr");
                    const stats = pitcher?.stats?.pitching ?? {};
                    const pitcherName = pitcher ? getPersonName(pitcher?.person) : "";
                    const walks = Number(stats.baseOnBalls);
                    const hitByPitch = Number(stats.hitByPitch);
                    const walksAndHitByPitch = Number.isFinite(walks) || Number.isFinite(hitByPitch)
                        ? (Number.isFinite(walks) ? walks : 0) + (Number.isFinite(hitByPitch) ? hitByPitch : 0)
                        : "";
                    const values = pitcher ? [
                        `${pitcherName}${getPitcherDecisionSuffix(pitcher?.person)}`,
                        stats.numberOfPitches ?? "",
                        stats.inningsPitched ?? "",
                        stats.hits ?? "",
                        stats.runs ?? "",
                        stats.earnedRuns ?? "",
                        walksAndHitByPitch,
                        stats.strikeOuts ?? "",
                        stats.era ?? ""
                    ] : Array.from({ length: pitchingHeaders.length }, () => "");

                    values.forEach((value, valueIndex) => {
                        const td = createElement("td", "", String(value ?? ""));
                        if (valueIndex === 0) {
                            td.className = "pitcher-column";
                            td.textContent = "";
                            td.append(createPlayerProfileLink(pitcher?.person ?? {}, String(value ?? "")));
                        }
                        else if (valueIndex === 1) td.className = "pitch-count-column";
                        else td.className = "stat-column";
                        row.append(td);
                    });

                    tbody.append(row);
                });

                table.append(tbody);
                wrap.append(table);
                box.append(wrap);

                return box;
            };
            const buildSideTables = (side) => {
                const wrapper = createElement("div", "side-stats");

                const notesBox = createElement("section", "table-box special-notes-box");
                notesBox.append(
                    createElement("div", "table-title", "特記事項")
                );

                const notesColumns = createElement("div", "special-notes-columns");
                for (let column = 0; column < 2; column += 1) {
                    const notesTable = createElement("div", "special-notes");
                    for (let row = 0; row < 6; row += 1) {
                        const noteIndex = column * 6 + row;
                        const note = createElement(
                            "div",
                            "special-note-row",
                            state.streakNotes?.[side]?.[noteIndex] ?? ""
                        );
                        note.contentEditable = "true";
                        note.spellcheck = false;
                        note.dataset.noteRow = String(noteIndex + 1);
                        notesTable.append(note);
                    }
                    notesColumns.append(notesTable);
                }
                notesBox.append(notesColumns);
                wrapper.append(notesBox);

                return wrapper;
            };

            const buildTeamPanelTitle = (side) => {
                const team = state[side];
                const title = createElement("div", "team-panel-title");
                const mainLine = createElement(
                    "div",
                    "team-panel-title-main"
                );

                mainLine.append(
                    createElement(
                        "span",
                        "team-panel-title-name",
                        team.name
                    )
                );

                if (Number.isFinite(team.wins) && Number.isFinite(team.losses)) {
                    mainLine.append(
                        createElement(
                            "span",
                            "team-panel-title-record",
                            `${team.wins}-${team.losses}`
                        )
                    );
                }

                title.append(mainLine);

                if (team.division) {
                    title.append(
                        createElement(
                            "div",
                            "team-panel-title-division",
                            `（${team.division}）`
                        )
                    );
                }

                return title;
            };

            const buildTeamPanel = (side) => {
                const panel = createElement("section", "team-score-panel");
                panel.style.setProperty(
                    "--score-column-count",
                    String(getInningColumns(side).length)
                );

                panel.append(
                    buildTeamPanelTitle(side),
                    buildScoreGrid(side),
                    buildBenchRows(side),
                    buildSummaryRows(side)
                );

                const bottom = createElement("section", "sheet-bottom");
                bottom.append(buildPitchingTable(side), buildSideTables(side));
                panel.append(bottom);

                return panel;
            };

            const buildSheet = () => {
                const wrapper = createElement("div");
                wrapper.append(
                    buildScoreHeaderArea(state.gameData)
                );

                const dualLayout = createElement("section", "dual-score-layout");
                dualLayout.append(
                    buildTeamPanel("away"),
                    buildTeamPanel("home")
                );

                wrapper.append(dualLayout);
                return wrapper;
            };

            const render = () => {
                document.documentElement.style.setProperty(
                    "--inning-count",
                    String(state.innings)
                );
                document.documentElement.style.setProperty(
                    "--score-column-count",
                    String(Math.max(
                        getInningColumns("away").length,
                        getInningColumns("home").length
                    ))
                );

                dom.inningCount.textContent = String(state.innings);

                dom.awaySheet.replaceChildren(buildSheet());
                const scorePanelWidth = dom.awaySheet
                    .querySelector(".team-score-panel")
                    ?.getBoundingClientRect().width;
                if (Number.isFinite(scorePanelWidth) && scorePanelWidth > 0) {
                    document.documentElement.style.setProperty(
                        "--team-score-width",
                        `${scorePanelWidth}px`
                    );
                }
                populateScoreGrid();
                dom.homeSheet.replaceChildren();
                dom.awayPage.classList.add("active");
                dom.homePage.classList.remove("active");
            };

            const updateSidebar = () => {
                dom.homeTeam.textContent = state.home.name;
                dom.awayTeam.textContent = state.away.name;
                dom.gameDate.textContent = getGameDateText(state.gameData);
                dom.ballpark.textContent =
                    getJapaneseVenueName(state.gameData);
                dom.gameStatus.textContent = getStatusText(state.gameData);
                dom.inningCount.textContent = String(state.innings);
            };

            const fetchGameData = async (gamePk) => {
                const endpoint =
                    `https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`;

                const response = await fetch(endpoint);

                if (!response.ok) {
                    throw new Error(
                        `MLBデータの取得に失敗しました（${response.status}）`
                    );
                }

                return response.json();
            };

            const loadGame = async () => {
                const gamePk = extractGamePk(dom.gameInput.value);

                if (!gamePk) {
                    setStatus(
                        "Gameday URLまたはGame PKを正しく入力してください。",
                        true
                    );
                    return;
                }

                dom.loadButton.disabled = true;
                setStatus(`Game PK ${gamePk} を取得しています…`);

                try {
                    const data = await fetchGameData(gamePk);

                    state.gamePk = gamePk;
                    state.gameData = data;
                    state.innings = determineInningCount(data);
                    state.inningColumns = determineInningColumns(data, state.innings);
                    state.defensivePositionHistory = buildDefensivePositionHistory(data);
                    state.away = getTeamState(data, "away");
                    state.home = getTeamState(data, "home");
                    [state.streakNotes, state.headToHead] = await Promise.all([
                        fetchStreakNotes(data, gamePk),
                        fetchHeadToHeadRecord(data, gamePk)
                    ]);

                    updateSidebar();
                    render();

                    setStatus(
