<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MLB Scorebook Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">
    <h1>MLB SCOREBOOK GENERATOR</h1>
    <p>Professional Baseball Scorebook System</p>
</div>

<div class="version">
    Ver. 1.0.0
</div>
    </header>

    <!-- Main -->
    <main class="container">

        <!-- Left Panel -->
        <aside class="sidebar">

            <h2>Game Data</h2>

            <label for="gameday-url">
                MLB Gameday URL
            </label>

            <input
                type="text"
                id="gameday-url"
                placeholder="https://www.mlb.com/gameday/...">

            <button id="load-btn">
                試合データを取得
            </button>

            <button id="generate-btn">
                スコアブック生成
            </button>
            <button id="save-btn">
    保存
</button>

           <hr>

<h3>Game Information</h3>

<div class="game-info">

    <div class="info-row">
        <span>HOME</span>
        <span id="home-team">-</span>
    </div>

    <div class="info-row">
        <span>AWAY</span>
        <span id="away-team">-</span>
    </div>

    <div class="info-row">
        <span>DATE</span>
        <span id="game-date">-</span>
    </div>

    <div class="info-row">
        <span>BALLPARK</span>
        <span id="ballpark">-</span>
    </div>

    <div class="info-row">
        <span>STATUS</span>
        <span id="game-status">-</span>
    </div>

</div>
<hr>

<h3>Scorebook Library</h3>

<div id="library-list">

    <!-- 保存したスコアブック一覧 -->

</div>
        </aside>

        <!-- Scorebook -->
        <section class="viewer">

           <div class="scorebook">

    <div class="scorebook-page">

        <header class="scorebook-header">

            <div class="scorebook-title">
                MLB SCOREBOOK
            </div>

            <div class="scorebook-game-meta">

                <div class="scorebook-meta-item">
                    <span>AWAY</span>
                    <strong id="scorebook-away-team">—</strong>
                </div>

                <div class="scorebook-meta-item">
                    <span>HOME</span>
                    <strong id="scorebook-home-team">—</strong>
                </div>

                <div class="scorebook-meta-item">
                    <span>DATE</span>
                    <strong id="scorebook-date">—</strong>
                </div>

                <div class="scorebook-meta-item">
                    <span>BALLPARK</span>
                    <strong id="scorebook-ballpark">—</strong>
                </div>

            </div>

        </header>

        <section class="scorebook-body">

            <div class="lineup-section">

                <div class="lineup-heading">
                    AWAY LINEUP
                </div>

                <div id="away-lineup-table" class="lineup-table">

                    <!-- JavaScriptで打順を表示 -->

                </div>

            </div>

            <div class="score-grid-section">

                <div class="score-grid-placeholder">
                    SCOREBOOK GRID
                </div>

            </div>

        </section>

    </div>

</div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">

        <button>PDF</button>

        <button>PNG</button>

        <button>PRINT</button>

        <button>JSON</button>

    </footer>

  <script src="app.js?v=6" defer></script>

</body>

</html>
