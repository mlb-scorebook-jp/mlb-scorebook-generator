<!DOCTYPE html>
<!-- TEST -->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Scorebook Generator</title>
    <!-- Score notation update: stacked batted-ball symbol, red hits, blue strikeouts, black other results. -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="app-header">
        <div class="app-title">
            <h1>MLB SCOREBOOK GENERATOR</h1>
            <p>WASEDA STYLE DIGITAL SCOREBOOK</p>
        </div>

        <div class="version">Ver. 2.3.2</div>
    </header>

    <main class="app-main">
        <aside class="sidebar">
            <h2>Game Data</h2>

            <label for="gameday-url">MLB Gameday URL / Game PK</label>
            <input
                type="text"
                id="gameday-url"
                placeholder="https://www.mlb.com/gameday/... または gamePk">

            <button id="load-btn">試合データを取得</button>
            <button id="generate-btn">スコアブック生成</button>
            <button id="save-btn">保存</button>

            <div class="status-message" id="status-message">
                初期表示は9回です。Gameday取得後は実際のイニング数に合わせて自動拡張します。
            </div>

            <hr>

            <h3>Page</h3>

            <div class="page-switch">
                <button id="away-page-btn" class="active">先攻</button>
                <button id="home-page-btn">後攻</button>
            </div>

            <hr>

            <h3>Game Information</h3>

            <div class="game-info">
                <div class="info-row">
                    <span>HOME</span>
                    <span id="home-team">-</span>
                </div>

                <div class="info-row">
                    <span>AWAY</span>
                    <span id="away-team">-</span>
                </div>

                <div class="info-row">
                    <span>DATE</span>
                    <span id="game-date">-</span>
                </div>

                <div class="info-row">
                    <span>BALLPARK</span>
                    <span id="ballpark">-</span>
                </div>

                <div class="info-row">
                    <span>STATUS</span>
                    <span id="game-status">-</span>
                </div>

                <div class="info-row">
                    <span>INNINGS</span>
                    <span id="inning-count-display">9</span>
                </div>
            </div>

            <hr>

            <h3>Scorebook Library</h3>
            <div id="library-list"></div>
        </aside>

        <section class="viewer">
            <article class="paper scorebook-page active" id="away-page">
                <div id="away-sheet"></div>
            </article>

            <article class="paper scorebook-page" id="home-page">
                <div id="home-sheet"></div>
            </article>
        </section>
    </main>

    <footer class="app-footer">
        <button type="button" id="pdf-btn">PDF</button>
        <button type="button" id="png-btn">PNG</button>
        <button type="button" id="print-btn">PRINT</button>
        <button type="button" id="json-btn">JSON</button>
    </footer>

    <script src="js/players.js"></script>

    <script>
        (() => {
            "use strict";

            const DEFAULT_INNINGS = 9;
            const MIN_INNINGS = 9;
            const MAX_SAFE_INNINGS = 30;

            // Player-name readings are loaded from js/players.js.

            const NHK_TEAM_NAMES = {"arizonadiamondbacks":"アリゾナ・ダイヤモンドバックス","athletics":"アスレチックス","atlantabraves":"アトランタ・ブレーブス","baltimoreorioles":"ボルチモア・オリオールズ","bostonredsox":"ボストン・レッドソックス","chicagocubs":"シカゴ・カブス","chicagowhitesox":"シカゴ・ホワイトソックス","cincinnatireds":"シンシナティ・レッズ","clevelandguardians":"クリーブランド・ガーディアンズ","coloradorockies":"コロラド・ロッキーズ","detroittigers":"デトロイト・タイガース","houstonastros":"ヒューストン・アストロズ","kansascityroyals":"カンザスシティ・ロイヤルズ","losangelesangels":"ロサンゼルス・エンゼルス","losangelesdodgers":"ロサンゼルス・ドジャース","miamimarlins":"マイアミ・マーリンズ","milwaukeebrewers":"ミルウォーキー・ブルワーズ","minnesotatwins":"ミネソタ・ツインズ","newyorkmets":"ニューヨーク・メッツ","newyorkyankees":"ニューヨーク・ヤンキース","philadelphiaphillies":"フィラデルフィア・フィリーズ","pittsburghpirates":"ピッツバーグ・パイレーツ","sandiegopadres":"サンディエゴ・パドレス","sanfranciscogiants":"サンフランシスコ・ジャイアンツ","seattlemariners":"シアトル・マリナーズ","stlouiscardinals":"セントルイス・カージナルス","tampabayrays":"タンパベイ・レイズ","texasrangers":"テキサス・レンジャーズ","torontobluejays":"トロント・ブルージェイズ","washingtonnationals":"ワシントン・ナショナルズ"};

            const JAPANESE_DIVISION_NAMES = {
                "americanleagueeast": "アメリカンリーグ東部地区",
                "americanleaguecentral": "アメリカンリーグ中部地区",
                "americanleaguewest": "アメリカンリーグ西部地区",
                "nationaleagueeast": "ナショナルリーグ東部地区",
                "nationaleaguecentral": "ナショナルリーグ中部地区",
                "nationaleaguewest": "ナショナルリーグ西部地区",
                "aleast": "アメリカンリーグ東部地区",
                "alcentral": "アメリカンリーグ中部地区",
                "alwest": "アメリカンリーグ西部地区",
                "nleast": "ナショナルリーグ東部地区",
                "nlcentral": "ナショナルリーグ中部地区",
                "nlwest": "ナショナルリーグ西部地区"
            };

            const TEAM_DIVISION_BY_NAME = {
                "アリゾナ・ダイヤモンドバックス": "ナショナルリーグ西部地区",
                "アスレチックス": "アメリカンリーグ西部地区",
                "アトランタ・ブレーブス": "ナショナルリーグ東部地区",
                "ボルチモア・オリオールズ": "アメリカンリーグ東部地区",
                "ボストン・レッドソックス": "アメリカンリーグ東部地区",
                "シカゴ・カブス": "ナショナルリーグ中部地区",
                "シカゴ・ホワイトソックス": "アメリカンリーグ中部地区",
                "シンシナティ・レッズ": "ナショナルリーグ中部地区",
                "クリーブランド・ガーディアンズ": "アメリカンリーグ中部地区",
                "コロラド・ロッキーズ": "ナショナルリーグ西部地区",
                "デトロイト・タイガース": "アメリカンリーグ中部地区",
                "ヒューストン・アストロズ": "アメリカンリーグ西部地区",
                "カンザスシティ・ロイヤルズ": "アメリカンリーグ中部地区",
                "ロサンゼルス・エンゼルス": "アメリカンリーグ西部地区",
                "ロサンゼルス・ドジャース": "ナショナルリーグ西部地区",
                "マイアミ・マーリンズ": "ナショナルリーグ東部地区",
                "ミルウォーキー・ブルワーズ": "ナショナルリーグ中部地区",
                "ミネソタ・ツインズ": "アメリカンリーグ中部地区",
                "ニューヨーク・メッツ": "ナショナルリーグ東部地区",
                "ニューヨーク・ヤンキース": "アメリカンリーグ東部地区",
                "フィラデルフィア・フィリーズ": "ナショナルリーグ東部地区",
                "ピッツバーグ・パイレーツ": "ナショナルリーグ中部地区",
                "サンディエゴ・パドレス": "ナショナルリーグ西部地区",
                "サンフランシスコ・ジャイアンツ": "ナショナルリーグ西部地区",
                "シアトル・マリナーズ": "アメリカンリーグ西部地区",
                "セントルイス・カージナルス": "ナショナルリーグ中部地区",
                "タンパベイ・レイズ": "アメリカンリーグ東部地区",
                "テキサス・レンジャーズ": "アメリカンリーグ西部地区",
                "トロント・ブルージェイズ": "アメリカンリーグ東部地区",
                "ワシントン・ナショナルズ": "ナショナルリーグ東部地区"
            };

            const JAPANESE_VENUE_NAMES = {
                "americafamilyfield": "アメリカンファミリー・フィールド",
                "angelstadium": "エンゼル・スタジアム",
                "buschstadium": "ブッシュ・スタジアム",
                "orioleparkatcamdenyards": "オリオール・パーク・アット・カムデンヤーズ",
                "chasefield": "チェイス・フィールド",
                "citifield": "シティ・フィールド",
                "citizensbankpark": "シチズンズ・バンク・パーク",
                "comericapark": "コメリカ・パーク",
                "coorsfield": "クアーズ・フィールド",
                "dodgerstadium": "ドジャー・スタジアム",
                "fenwaypark": "フェンウェイ・パーク",
                "globelifefield": "グローブライフ・フィールド",
                "greatamericanballpark": "グレートアメリカン・ボールパーク",
                "ratefield": "ギャランティードレート・フィールド",
                "kauffmanstadium": "カウフマン・スタジアム",
                "loandepotpark": "ローンデポ・パーク",
                "daikinpark": "ダイキン・パーク",
                "nationalspark": "ナショナルズ・パーク",
                "oaklandalamedacountycoliseum": "オークランド・コロシアム",
                "oraclepark": "オラクル・パーク",
                "petcopark": "ペトコ・パーク",
                "pncpark": "PNCパーク",
                "progressivefield": "プログレッシブ・フィールド",
                "rogerscentre": "ロジャーズ・センター",
                "sutterhealthpark": "サター・ヘルス・パーク",
                "targetfield": "ターゲット・フィールド",
                "tmobilepark": "Tモバイル・パーク",
                "tropicanafield": "トロピカーナ・フィールド",
                "truistpark": "トゥルーイスト・パーク",
                "wrigleyfield": "リグリー・フィールド",
                "yankeestadium": "ヤンキー・スタジアム",
                "guaranteedratefield": "レート・フィールド",
                "minutemaidpark": "ダイキン・パーク",
                "oaklandcoliseum": "オークランド・コロシアム",
                "georgemsteinbrennerfield": "ジョージ・M・スタインブレナー・フィールド",
                "theathleticsballpark": "アスレチックス・ボールパーク"
            };

            const JAPANESE_WEATHER_CONDITIONS = {
                "clear": "晴れ",
                "sunny": "晴れ",
                "partlycloudy": "晴れ時々曇り",
                "mostlycloudy": "曇り時々晴れ",
                "cloudy": "曇り",
                "overcast": "曇り",
                "drizzle": "霧雨",
                "lightrain": "小雨",
                "rain": "雨",
                "heavyrain": "大雨",
                "thunderstorm": "雷雨",
                "snow": "雪",
                "fog": "霧",
                "hazy": "かすみ",
                "dome": "屋内",
                "indoor": "屋内",
                "roofclosed": "屋根閉鎖",
                "roofopen": "屋根開放"
            };


            const normalizeLookupKey = (value) => {
                return String(value ?? "")
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase()
                    .replace(/[^a-z0-9]/g, "");
            };

            const getNhkTeamName = (team) => {
                const candidates = [
                    team?.name,
                    team?.teamName,
                    team?.clubName,
                    team?.shortName
                ];

                for (const candidate of candidates) {
                    const converted = NHK_TEAM_NAMES[normalizeLookupKey(candidate)];

                    if (converted) {
                        return converted;
                    }
                }

                return team?.name || team?.teamName || team?.clubName || "";
            };

            const getJapaneseVenueName = (data) => {
                const venueName = data?.gameData?.venue?.name ?? "";
                const key = normalizeLookupKey(venueName);

                return JAPANESE_VENUE_NAMES[key] || venueName || "-";
            };

            const translateWeatherCondition = (condition) => {
                const raw = String(condition ?? "").trim();
                const key = normalizeLookupKey(raw);

                if (!raw) {
                    return "";
                }

                return JAPANESE_WEATHER_CONDITIONS[key] || raw;
            };

            const fahrenheitToCelsius = (fahrenheit) => {
                const value = Number(fahrenheit);

                if (!Number.isFinite(value)) {
                    return "";
                }

                return `${Math.round((value - 32) * 5 / 9)}℃`;
            };

            const isGameFinal = (data) => {
                const status = data?.gameData?.status;
                const abstractState = String(status?.abstractGameState ?? "").toLowerCase();
                const codedState = String(status?.codedGameState ?? "").toUpperCase();

                return abstractState === "final" || ["F", "O"].includes(codedState);
            };

            const shouldShowNoBottomMark = (side, inningNumber) => {
                if (side !== "home" || inningNumber !== state.innings || !isGameFinal(state.gameData)) {
                    return false;
                }

                const awayRuns = Number(getTeamTotal("away", "runs"));
                const homeRuns = Number(getTeamTotal("home", "runs"));

                if (!Number.isFinite(awayRuns) || !Number.isFinite(homeRuns) || homeRuns <= awayRuns) {
                    return false;
                }

                const plays = state.gameData?.liveData?.plays?.allPlays ?? [];
                const bottomHalfWasPlayed = plays.some((play) => {
                    return Number(play?.about?.inning) === inningNumber &&
                        Boolean(play?.about?.isTopInning) === false;
                });

                return !bottomHalfWasPlayed;
            };

            const state = {
                innings: DEFAULT_INNINGS,
                gamePk: null,
                gameData: null,
                away: {
                    abbreviation: "AWAY",
                    name: "先攻チーム",
                    players: [],
                    pitchers: []
                },
                home: {
                    abbreviation: "HOME",
                    name: "後攻チーム",
                    players: [],
                    pitchers: []
                }
            };

            const statHeaders = [
                "打数",
                "安打",
                "得点",
                "打点",
                "四球",
                "三振"
            ];

            const pitchingHeaders = [
                "投手名",
                "球数",
                "回",
                "被安打",
                "失点",
                "自責点",
                "四死球",
                "奪三振",
                "防御率"
            ];

            const dom = {
                gameInput: document.getElementById("gameday-url"),
                loadButton: document.getElementById("load-btn"),
                generateButton: document.getElementById("generate-btn"),
                saveButton: document.getElementById("save-btn"),
                awayPageButton: document.getElementById("away-page-btn"),
                homePageButton: document.getElementById("home-page-btn"),
                awayPage: document.getElementById("away-page"),
                homePage: document.getElementById("home-page"),
                awaySheet: document.getElementById("away-sheet"),
                homeSheet: document.getElementById("home-sheet"),
                homeTeam: document.getElementById("home-team"),
                awayTeam: document.getElementById("away-team"),
                gameDate: document.getElementById("game-date"),
                ballpark: document.getElementById("ballpark"),
                gameStatus: document.getElementById("game-status"),
                inningCount: document.getElementById("inning-count-display"),
                statusMessage: document.getElementById("status-message"),
                printButton: document.getElementById("print-btn"),
                jsonButton: document.getElementById("json-btn"),
                pdfButton: document.getElementById("pdf-btn"),
                pngButton: document.getElementById("png-btn")
            };

            const createElement = (tagName, className = "", text = "") => {
                const element = document.createElement(tagName);

                if (className) {
                    element.className = className;
                }

                if (text !== "") {
                    element.textContent = text;
                }

                return element;
            };

            const setStatus = (message, isError = false) => {
                dom.statusMessage.textContent = message;
                dom.statusMessage.style.color = isError ? "#ffb4b4" : "#b8c4ca";
            };

            const extractGamePk = (value) => {
                const trimmed = value.trim();

                if (/^\d+$/.test(trimmed)) {
                    return trimmed;
                }

                const directMatch = trimmed.match(/gamePk[=\/](\d+)/i);

                if (directMatch) {
                    return directMatch[1];
                }

                const gamedayMatch = trimmed.match(/gameday\/[^/]*-(\d+)(?:[/?#]|$)/i);

                if (gamedayMatch) {
                    return gamedayMatch[1];
                }

                const numbers = trimmed.match(/\d{6,}/g);

                return numbers ? numbers[numbers.length - 1] : null;
            };

            const clampInningCount = (value) => {
                const numeric = Number(value);

                if (!Number.isFinite(numeric)) {
                    return DEFAULT_INNINGS;
                }

                return Math.min(
                    MAX_SAFE_INNINGS,
                    Math.max(MIN_INNINGS, Math.ceil(numeric))
                );
            };

            const determineInningCount = (data) => {
                const linescoreInnings =
                    data?.liveData?.linescore?.innings?.length ?? 0;

                const currentInning =
                    data?.liveData?.linescore?.currentInning ?? 0;

                const plays = data?.liveData?.plays?.allPlays ?? [];

                const playInning = plays.reduce((max, play) => {
                    const inning = play?.about?.inning ?? 0;
                    return Math.max(max, inning);
                }, 0);

                const scheduledInnings =
                    data?.gameData?.game?.scheduledInnings ?? DEFAULT_INNINGS;

                return clampInningCount(
                    Math.max(
                        scheduledInnings,
                        linescoreInnings,
                        currentInning,
                        playInning
                    )
                );
            };

            const getPersonName = (person) => {
                const candidates = [
                    person?.fullName,
                    person?.nameFirstLast,
                    [person?.firstName, person?.lastName].filter(Boolean).join(" ")
                ];

                for (const candidate of candidates) {
                    const converted = NHK_PLAYER_NAMES[normalizeLookupKey(candidate)];

                    if (converted) {
                        return converted;
                    }
                }

                return (
                    person?.fullName ||
                    person?.nameFirstLast ||
                    person?.lastFirstName ||
                    ""
                );
            };

            const getPlayersForSide = (data, side) => {
                const boxscore = data?.liveData?.boxscore;
                const teamData = boxscore?.teams?.[side];

                if (!teamData) {
                    return Array.from({ length: 9 }, () => []);
                }

                const playerMap = teamData.players ?? {};
                const battingOrder = teamData.battingOrder ?? [];
                const slots = Array.from({ length: 9 }, () => []);
                const seen = new Set();

                Object.values(playerMap).forEach((player) => {
                    const rawOrder = Number.parseInt(player?.battingOrder, 10);

                    if (!Number.isFinite(rawOrder)) {
                        return;
                    }

                    const slotIndex = Math.floor(rawOrder / 100) - 1;

                    if (slotIndex < 0 || slotIndex >= 9) {
                        return;
                    }

                    slots[slotIndex].push(player);
                });

                slots.forEach((slot) => {
                    slot.sort((a, b) => {
                        const aOrder = Number.parseInt(a?.battingOrder, 10) || 0;
                        const bOrder = Number.parseInt(b?.battingOrder, 10) || 0;
                        return aOrder - bOrder;
                    });

                    slot.forEach((player) => {
                        const id = player?.person?.id;
                        if (id) {
                            seen.add(id);
                        }
                    });
                });

                battingOrder.forEach((playerId, index) => {
                    if (seen.has(playerId)) {
                        return;
                    }

                    const player = playerMap[`ID${playerId}`];

                    if (!player) {
                        return;
                    }

                    const slotIndex = index % 9;
                    slots[slotIndex].push(player);
                    seen.add(playerId);
                });

                if (slots.some((slot) => slot.length)) {
                    return slots;
                }

                Object.values(playerMap)
                    .filter((player) => player?.stats?.batting)
                    .slice(0, 9)
                    .forEach((player, index) => {
                        slots[index].push(player);
                    });

                return slots;
            };

            const getPitchersForSide = (data, side) => {
                const boxscore = data?.liveData?.boxscore;
                const teamData = boxscore?.teams?.[side];

                if (!teamData) {
                    return [];
                }

                const playerMap = teamData.players ?? {};
                const pitchers = teamData.pitchers ?? [];

                return pitchers
                    .map((playerId) => playerMap[`ID${playerId}`])
                    .filter(Boolean);
            };

            const getJapaneseDivisionName = (team) => {
                const divisionName =
                    team?.division?.name ||
                    team?.division?.nameShort ||
                    team?.division?.abbreviation ||
                    "";

                const normalized = normalizeLookupKey(divisionName)
                    .replace(/division$/, "");

                return JAPANESE_DIVISION_NAMES[normalized] || "";
            };

            const getTeamRecord = (team, boxscoreTeam) => {
                const record =
                    team?.record ||
                    team?.leagueRecord ||
                    boxscoreTeam?.team?.record ||
                    boxscoreTeam?.team?.leagueRecord ||
                    {};

                const wins = Number(record?.wins);
                const losses = Number(record?.losses);

                return {
                    wins: Number.isFinite(wins) ? wins : null,
                    losses: Number.isFinite(losses) ? losses : null
                };
            };

            const getTeamState = (data, side) => {
                const team = data?.gameData?.teams?.[side] ?? {};
                const boxscoreTeam = data?.liveData?.boxscore?.teams?.[side];

                const nhkTeamName =
                    getNhkTeamName(team) ||
                    getNhkTeamName(boxscoreTeam?.team) ||
                    (side === "away" ? "先攻チーム" : "後攻チーム");

                const record = getTeamRecord(team, boxscoreTeam);

                return {
                    abbreviation: nhkTeamName,
                    name: nhkTeamName,
                    wins: record.wins,
                    losses: record.losses,
                    division: getJapaneseDivisionName(team) ||
                        getJapaneseDivisionName(boxscoreTeam?.team) ||
                        TEAM_DIVISION_BY_NAME[nhkTeamName] || "",
                    players: getPlayersForSide(data, side),
                    pitchers: getPitchersForSide(data, side)
                };
            };

            const getGameDateText = (data) => {
                const dateText = data?.gameData?.datetime?.officialDate;

                if (!dateText) {
                    return "-";
                }

                const [year, month, day] = dateText.split("-");
                return `${year}年${Number(month)}月${Number(day)}日`;
            };

            const getStartTimeText = (data) => {
                const iso = data?.gameData?.datetime?.dateTime;

                if (!iso) {
                    return "-";
                }

                const date = new Date(iso);

                if (Number.isNaN(date.getTime())) {
                    return "-";
                }

                return new Intl.DateTimeFormat("ja-JP", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                }).format(date);
            };

            const getEndTimeText = (data) => {
                const endTime = data?.gameData?.datetime?.endTime;

                if (endTime) {
                    return endTime;
                }

                return "-";
            };

            const getDurationText = (data) => {
                const minutes = data?.gameData?.gameInfo?.gameDurationMinutes;

                if (!Number.isFinite(minutes)) {
                    return "-";
                }

                const hours = Math.floor(minutes / 60);
                const remainder = minutes % 60;

                return `${hours}:${String(remainder).padStart(2, "0")}`;
            };

            const getWeatherText = (data) => {
                const weather = data?.gameData?.weather;

                if (!weather) {
                    return "-";
                }

                const condition = translateWeatherCondition(weather.condition);
                const temp = fahrenheitToCelsius(weather.temp);

                return [condition, temp].filter(Boolean).join(" ") || "-";
            };

            const getStatusText = (data) => {
                return (
                    data?.gameData?.status?.detailedState ||
                    data?.gameData?.status?.abstractGameState ||
                    "-"
                );
            };

            const getLineScoreValue = (side, inningNumber) => {
                if (shouldShowNoBottomMark(side, inningNumber)) {
                    return "×";
                }

                const inning = state.gameData?.liveData?.linescore?.innings?.find(
                    (item) => item?.num === inningNumber
                );

                const value = inning?.[side]?.runs;
                return value === undefined || value === null ? "" : String(value);
            };

            const getTeamTotal = (side, key) => {
                const value = state.gameData?.liveData?.linescore?.teams?.[side]?.[key];
                return value === undefined || value === null ? "" : String(value);
            };

            const buildTopScore = () => {
                const container = createElement("section", "top-score");

                container.append(createElement("div", "", ""));

                for (let inning = 1; inning <= state.innings; inning += 1) {
                    container.append(createElement("div", "", String(inning)));
                }

                ["R", "H", "E"].forEach((label) => {
                    container.append(createElement("div", "", label));
                });

                ["away", "home"].forEach((side) => {
                    container.append(
                        createElement("div", "team-name", state[side].name)
                    );

                    for (let inning = 1; inning <= state.innings; inning += 1) {
                        const value = getLineScoreValue(side, inning);
                        container.append(
                            createElement(
                                "div",
                                value === "×" ? "no-bottom" : "",
                                value
                            )
                        );
                    }

                    container.append(
                        createElement("div", "", getTeamTotal(side, "runs")),
                        createElement("div", "", getTeamTotal(side, "hits")),
                        createElement("div", "", getTeamTotal(side, "errors"))
                    );
                });

                return container;
            };

            const buildAbsChallengeTable = () => {
                const box = createElement("section", "abs-challenge-box");
                box.append(
                    createElement(
                        "div",
                        "abs-challenge-title",
                        "CHALLENGE LOG"
                    )
                );

                const grid = createElement("div", "abs-challenge-grid");
                ["回", "種類", "チーム", "チャレンジ者", "対象", "結果"].forEach(
                    (label) => {
                        grid.append(createElement("div", "abs-head", label));
                    }
                );

                for (let row = 0; row < 8; row += 1) {
                    for (let column = 0; column < 6; column += 1) {
                        const cell = createElement("div", "editable-cell");
                        cell.contentEditable = "true";
                        cell.spellcheck = false;
                        cell.dataset.absRow = String(row + 1);
                        cell.dataset.absColumn = String(column + 1);
                        grid.append(cell);
                    }
                }

                box.append(grid);
                return box;
            };

            const buildScoreHeaderArea = (data) => {
                const area = createElement("section", "score-header-area");
                const left = createElement("div", "score-header-left");
                left.append(buildTopScore(), buildSheetMeta(data));
                area.append(left, buildAbsChallengeTable());
                return area;
            };

            const buildSheetMeta = (data) => {
                const fragment = document.createDocumentFragment();
                const meta = createElement("section", "sheet-meta");

                const items = [
                    ["日付", getGameDateText(data)],
                    ["球場", getJapaneseVenueName(data)],
                    ["開始", getStartTimeText(data)],
                    ["終了", getEndTimeText(data)],
                    ["天候", getWeatherText(data)],
                    ["時間", getDurationText(data)],
                    ["状態", getStatusText(data)],
                    ["観衆", data?.gameData?.gameInfo?.attendance ?? "-"]
                ];

                items.forEach(([label, value]) => {
                    meta.append(
                        createElement("div", "label", label),
                        createElement("div", "", String(value ?? ""))
                    );
                });

                fragment.append(meta);

                return fragment;
            };

            const createPitchColumn = () => {
                return createElement("div", "pitch-column");
            };

            const createAtBatCell = (side, inning, order) => {
                const cell = createElement("div", "grid-cell atbat-cell");
                cell.dataset.side = side;
                cell.dataset.inning = String(inning);
                cell.dataset.order = String(order);

                const resultBox = createElement("div", "result-box");
                const diamond = createElement("div", "diamond");

                resultBox.append(diamond);
                cell.append(createPitchColumn(), resultBox);

                return cell;
            };

            const createPlayerRow = (side, order) => {
                const fragment = document.createDocumentFragment();
                const players = state[side].players[order - 1] ?? [];
                const rowHeight = 56;

                const makeStackCell = (className, valueGetter) => {
                    const cell = createElement("div", `grid-cell player-cell ${className}`);
                    cell.style.height = `${rowHeight}px`;

                    const compactClass = players.length >= 4
                        ? " compact-4"
                        : players.length >= 3
                            ? " compact-3"
                            : "";
                    const stack = createElement("div", `lineup-stack${compactClass}`);

                    players.forEach((player) => {
                        stack.append(
                            createElement("div", "lineup-entry", valueGetter(player))
                        );
                    });

                    cell.append(stack);
                    return cell;
                };

                const orderCell = createElement(
                    "div",
                    "grid-cell order-cell",
                    String(order)
                );
                orderCell.style.height = `${rowHeight}px`;

                fragment.append(
                    orderCell,
                    makeStackCell("center-cell", (player) => player?.jerseyNumber ?? ""),
                    makeStackCell("name-cell", (player) => getPersonName(player?.person ?? {})),
                    makeStackCell(
                        "center-cell",
                        (player) =>
                            player?.position?.abbreviation ||
                            player?.allPositions?.[0]?.abbreviation ||
                            ""
                    ),
                    makeStackCell("center-cell", (player) => player?.batSide?.code ?? "")
                );

                for (let inning = 1; inning <= state.innings; inning += 1) {
                    const atBatCell = createAtBatCell(side, inning, order);
                    atBatCell.style.height = `${rowHeight}px`;
                    fragment.append(atBatCell);
                }

                for (let index = 0; index < statHeaders.length; index += 1) {
                    fragment.append(createElement("div", "grid-cell stat-cell"));
                }

                return fragment;
            };


            const ROMAN_OUTS = ["", "Ⅰ", "Ⅱ", "Ⅲ"];

            const assignOutNumbers = (play, batterId) => {
                const startingOuts = Number(play?.about?.startOuts) || 0;
                const entries = (play?.runners ?? [])
                    .map((runner, sourceIndex) => ({
                        runner,
                        sourceIndex,
                        explicitOutNumber: Number(runner?.movement?.outNumber) || 0,
                        playIndex: Number(runner?.details?.playIndex)
                    }))
                    .filter(({ runner }) => Boolean(runner?.movement?.isOut));
                const endingOuts = Math.min(
                    3,
                    Math.max(startingOuts + entries.length, Number(play?.count?.outs) || 0)
                );
                const isGroundMultiOut = entries.length > 1 && (
                    String(play?.result?.eventType ?? "").toLowerCase().includes("ground") ||
                    String(play?.result?.description ?? "").toLowerCase().includes("ground")
                );

                entries.sort((left, right) => {
                    const leftExplicit = left.explicitOutNumber;
                    const rightExplicit = right.explicitOutNumber;
                    if (leftExplicit && rightExplicit && leftExplicit !== rightExplicit) {
                        return leftExplicit - rightExplicit;
                    }
                    if (Number.isFinite(left.playIndex) && Number.isFinite(right.playIndex) && left.playIndex !== right.playIndex) {
                        return left.playIndex - right.playIndex;
                    }

                    const leftIsBatter = Number(left.runner?.details?.runner?.id) === Number(batterId);
                    const rightIsBatter = Number(right.runner?.details?.runner?.id) === Number(batterId);
                    if (leftIsBatter !== rightIsBatter) {
                        return isGroundMultiOut
                            ? Number(leftIsBatter) - Number(rightIsBatter)
                            : Number(rightIsBatter) - Number(leftIsBatter);
                    }
                    return left.sourceIndex - right.sourceIndex;
                });

                const availableNumbers = [];
                for (let outNumber = startingOuts + 1; outNumber <= Math.min(3, endingOuts); outNumber += 1) {
                    availableNumbers.push(outNumber);
                }

                const assignedNumbers = new Map();
                const usedNumbers = new Set();
                entries.forEach(({ runner, explicitOutNumber }) => {
                    const isValidExplicit = explicitOutNumber > startingOuts &&
                        explicitOutNumber <= Math.min(3, endingOuts) &&
                        !usedNumbers.has(explicitOutNumber);
                    if (!isValidExplicit) return;
                    assignedNumbers.set(runner, explicitOutNumber);
                    usedNumbers.add(explicitOutNumber);
                });
                entries.forEach(({ runner }) => {
                    if (assignedNumbers.has(runner)) return;
                    const outNumber = availableNumbers.find((number) => !usedNumbers.has(number));
                    if (!outNumber) return;
                    assignedNumbers.set(runner, outNumber);
                    usedNumbers.add(outNumber);
                });
                return assignedNumbers;
            };

            const normalizeBase = (base) => {
                const value = String(base ?? "").toLowerCase();
                if (["home", "home_plate"].includes(value)) return "home";
                if (["1b", "first", "first_base"].includes(value)) return "1B";
                if (["2b", "second", "second_base"].includes(value)) return "2B";
                if (["3b", "third", "third_base"].includes(value)) return "3B";
                if (["score", "home", "home_plate"].includes(value)) return "score";
                return value;
            };

            const getBattingSlot = (side, playerId) => {
                const slots = state?.[side]?.players ?? [];
                for (let index = 0; index < slots.length; index += 1) {
                    if (slots[index].some((player) => Number(player?.person?.id) === Number(playerId))) {
                        return index + 1;
                    }
                }
                return null;
            };

            const getDescriptionFieldNumber = (play) => {
                const text = String(play?.result?.description ?? "").toLowerCase();
                const checks = [
                    [/pitcher|to the mound|back to the mound/, "1"],
                    [/catcher/, "2"],
                    [/first baseman|first base side/, "3"],
                    [/second baseman|second base side/, "4"],
                    [/third baseman|third base side/, "5"],
                    [/shortstop/, "6"],
                    [/left fielder|to left field|into left field|down the left field line/, "7"],
                    [/center fielder|to center field|into center field/, "8"],
                    [/right fielder|to right field|into right field|down the right field line/, "9"]
                ];
                return checks.find(([pattern]) => pattern.test(text))?.[1] ?? "";
            };

            const getFieldNumber = (play) => {
                const described = getDescriptionFieldNumber(play);
                if (described) return described;

                const credits = play?.credits ?? [];
                const fielder = credits.find((credit) =>
                    ["fielded_ball", "putout", "assist"].includes(String(credit?.credit).toLowerCase())
                );
                const credited = String(fielder?.position?.code ?? fielder?.position?.abbreviation ?? "").replace(/\D/g, "");
                if (credited) return credited;

                const location = String(play?.hitData?.location ?? "");
                const map = {
                    "1": "7", "2": "7", "3": "8", "4": "9",
                    "5": "5", "6": "6", "7": "6", "8": "4", "9": "3",
                    "13": "5", "14": "6", "15": "4", "16": "3",
                    "21": "7", "22": "8", "23": "9",
                    "51": "7", "52": "8", "53": "9",
                    "55": "7", "56": "8", "57": "9",
                    "58": "7", "59": "8", "60": "9"
                };
                return map[location] ?? "";
            };

            const getFieldingSequence = (play) => {
                const credits = play?.credits ?? [];
                const numbers = credits
                    .filter((credit) => ["assist", "putout"].includes(String(credit?.credit).toLowerCase()))
                    .map((credit) => String(credit?.position?.code ?? "").replace(/\D/g, ""))
                    .filter(Boolean);
                return numbers.filter((number, index) => index === 0 || number !== numbers[index - 1]).join("-");
            };

            const getBattedBallShape = (play) => {
                const trajectory = String(play?.hitData?.trajectory ?? "").toLowerCase();
                const description = String(play?.result?.description ?? "").toLowerCase();
                if (trajectory.includes("bunt") || description.includes("bunt")) return "bunt";
                if (trajectory.includes("ground") || description.includes("grounds") || description.includes("groundout")) return "ground";
                if (trajectory.includes("line") || description.includes("lines out") || description.includes("lineout")) return "line";
                if (trajectory.includes("popup") || description.includes("pops out") || description.includes("pop out")) return "pop";
                if (trajectory.includes("fly") || description.includes("flies out") || description.includes("flyout")) return "fly";
                return "";
            };

            const getHitNotation = (play, field) => field || "";

            const getSeasonHomeRunNumber = (play) => {
                const description = String(play?.result?.description ?? "");
                const match = description.match(/\b(?:homers?|home runs?|grand slams?)\s*\((\d+)\)/i);
                return match?.[1] ?? "";
            };

            const PLAY_TEMPLATES = Object.freeze({
                strikeout: { category: "out", notation: "K" },
                swinging_strikeout: { category: "out", notation: "Ks" },
                walk: { category: "reach", notation: "B" },
                intentional_walk: { category: "reach", notation: "DIB" },
                hit_by_pitch: { category: "reach", notation: "HBP" },
                single: { category: "hit" },
                double: { category: "hit" },
                triple: { category: "hit" },
                home_run: { category: "hit" },
                groundout: { category: "out", shape: "ground" },
                flyout: { category: "out", shape: "fly" },
                popout: { category: "out", shape: "fly" },
                lineout: { category: "out", shape: "line" },
                sac_fly: { category: "out", shape: "fly", prefix: "F" },
                sac_bunt: { category: "out", shape: "bunt" },
                field_error: { category: "reach" },
                fielders_choice: { category: "reach" },
                catcher_interference: { category: "reach", notation: "CI" },
                runner_interference: { category: "out", notation: "OI" },
                unknown_out: { category: "out" }
            });

            const resolveTemplateId = (play) => {
                const eventType = String(play?.result?.eventType ?? "").toLowerCase();
                const event = String(play?.result?.event ?? "").toLowerCase();
                const description = String(play?.result?.description ?? "").toLowerCase();

                if (eventType === "strikeout" || event.includes("strikeout")) {
                    return description.includes("swinging") ? "swinging_strikeout" : "strikeout";
                }
                if (["walk", "base_on_balls"].includes(eventType) || event === "walk") return "walk";
                if (["intent_walk", "intentional_walk"].includes(eventType) || event.includes("intentional walk")) return "intentional_walk";
                if (eventType === "hit_by_pitch" || event.includes("hit by pitch")) return "hit_by_pitch";
                if (["single", "double", "triple", "home_run"].includes(eventType)) return eventType;
                if (eventType === "field_error" || event.includes("error")) return "field_error";
                if (["fielders_choice", "fielders_choice_out"].includes(eventType) || event.includes("fielder's choice")) return "fielders_choice";
                if (["groundout", "force_out", "double_play", "grounded_into_double_play"].includes(eventType) || event.includes("groundout")) return "groundout";
                if (eventType === "field_out") {
                    const shape = getBattedBallShape(play);
                    if (shape === "ground") return "groundout";
                    if (shape === "line") return "lineout";
                    if (shape === "pop") return "popout";
                    return "flyout";
                }
                if (eventType === "flyout" || event.includes("flyout")) return "flyout";
                if (eventType === "pop_out" || event.includes("pop out")) return "popout";
                if (eventType === "lineout" || event.includes("lineout")) return "lineout";
                if (eventType === "sac_fly" || event.includes("sac fly")) return "sac_fly";
                if (["sac_bunt", "sacrifice_bunt"].includes(eventType) || event.includes("sac bunt")) return "sac_bunt";
                if (eventType.includes("catcher_interf")) return "catcher_interference";
                if (eventType.includes("runner_interf") || event.includes("interference")) return "runner_interference";
                return "unknown_out";
            };

            const getPlayDisplay = (play) => {
                const templateId = resolveTemplateId(play);
                const template = PLAY_TEMPLATES[templateId] ?? PLAY_TEMPLATES.unknown_out;
                const description = String(play?.result?.description ?? "").toLowerCase();
                const field = getFieldNumber(play);
                const sequence = getFieldingSequence(play);
                let notation = template.notation ?? "";

                if (["single", "double", "triple", "home_run"].includes(templateId)) {
                    notation = getHitNotation(play, field);
                } else if (templateId === "field_error") {
                    notation = `E${field || "?"}${description.includes("throwing error") ? "t" : "f"}`;
                } else if (templateId === "fielders_choice") {
                    notation = `Fc${field || ""}`;
                } else if (["groundout", "sac_bunt"].includes(templateId)) {
                    notation = sequence || field;
                } else if (["flyout", "popout", "lineout"].includes(templateId)) {
                    notation = field;
                } else if (templateId === "sac_fly") {
                    notation = field;
                }

                return {
                    templateId,
                    notation,
                    category: template.category,
                    isHit: template.category === "hit",
                    homeRunNumber: templateId === "home_run" ? getSeasonHomeRunNumber(play) : "",
                    extra: template.extra ?? "",
                    shape: template.shape ?? getBattedBallShape(play)
                };
            };

            const addPathSegments = (record, origin, end) => {
                const order = ["home", "1B", "2B", "3B", "score"];
                let from = normalizeBase(origin);
                let to = normalizeBase(end);
                if (to === "home") to = "score";
                let startIndex = order.indexOf(from);
                let endIndex = order.indexOf(to);
                if (startIndex < 0 || endIndex < 0 || endIndex <= startIndex) return;
                for (let index = startIndex; index < endIndex; index += 1) {
                    const key = `${order[index]}-${order[index + 1]}`;
                    if (!record.segments.includes(key)) record.segments.push(key);
                }
            };

            const buildPlateAppearanceRecords = () => {
                const records = [];
                const activeRunner = new Map();
                const plays = state.gameData?.liveData?.plays?.allPlays ?? [];

                plays.forEach((play, playIndex) => {
                    const side = play?.about?.halfInning === "top" ? "away" : "home";
                    const batterId = play?.matchup?.batter?.id;
                    const order = getBattingSlot(side, batterId);
                    const inning = Number(play?.about?.inning);
                    if (!order || !inning) return;

                    const display = getPlayDisplay(play);
                    const record = {
                        playIndex,
                        side,
                        inning,
                        order,
                        batterId,
                        templateId: display.templateId,
                        notation: display.notation,
                        category: display.category,
                        isHit: display.isHit,
                        homeRunNumber: display.homeRunNumber,
                        extra: display.extra,
                        shape: display.shape,
                        segments: [],
                        toSecond: "",
                        toThird: "",
                        toHome: "",
                        centerMark: "",
                        rbi: Number(play?.result?.rbi) || 0,
                        inningEnd: Boolean(play?.about?.isComplete && Number(play?.count?.outs) === 3)
                    };
                    records.push(record);

                    const runners = play?.runners ?? [];
                    const outNumberByRunner = assignOutNumbers(play, batterId);
                    let batterOutRecorded = false;
                    runners.forEach((runner) => {
                        const runnerId = runner?.details?.runner?.id;
                        const movement = runner?.movement ?? {};
                        const isCurrentBatter = Number(runnerId) === Number(batterId);
                        const runnerOrder = getBattingSlot(side, runnerId);
                        const fallbackTarget = runnerOrder
                            ? [...records].reverse().find((candidate) =>
                                candidate.side === side &&
                                candidate.inning === inning &&
                                candidate.order === runnerOrder
                            )
                            : null;
                        const target = isCurrentBatter
                            ? record
                            : activeRunner.get(Number(runnerId)) || fallbackTarget;
                        if (!target) return;

                        const origin = movement?.originBase || (isCurrentBatter ? "home" : "");
                        const end = movement?.end;

                        // Red path records only the batter-runner's result in this plate appearance.
                        if (target.isHit && isCurrentBatter) addPathSegments(target, origin, end);

                        // Later advances belong to the runner history of the original score cell.
                        if (!isCurrentBatter && origin && end) {
                            const advanceLabel = `（${order}）`;
                            const baseOrder = ["home", "1B", "2B", "3B", "score"];
                            let fromBase = normalizeBase(origin);
                            let toBase = normalizeBase(end);
                            if (toBase === "home") toBase = "score";
                            const fromIndex = baseOrder.indexOf(fromBase);
                            const toIndex = baseOrder.indexOf(toBase);
                            if (fromIndex >= 0 && toIndex > fromIndex) {
                                if (fromIndex < 2 && toIndex >= 2) target.toSecond = advanceLabel;
                                if (fromIndex < 3 && toIndex >= 3) target.toThird = advanceLabel;
                                if (toIndex >= 4) target.toHome = advanceLabel;
                            }
                        }

                        if (movement?.isOut) {
                            const outNumber = outNumberByRunner.get(runner);
                            if (outNumber) target.centerMark = ROMAN_OUTS[outNumber];
                            if (isCurrentBatter) batterOutRecorded = true;
                            activeRunner.delete(Number(runnerId));
                        } else if (["score", "home", "home_plate"].includes(String(end).toLowerCase())) {
                            target.centerMark = runner?.details?.earned === false ? "○" : "●";
                            activeRunner.delete(Number(runnerId));
                        } else if (end) {
                            activeRunner.set(Number(runnerId), target);
                        }
                    });

                    if (!batterOutRecorded && !runners.some((runner) => Number(runner?.details?.runner?.id) === Number(batterId))) {
                        const isOut = Boolean(play?.result?.isOut) || Number(play?.count?.outs) > Number(play?.about?.startOuts ?? 0);
                        if (isOut) {
                            record.centerMark = ROMAN_OUTS[Math.max(1, Math.min(3, Number(play?.count?.outs) || 1))];
                        }
                    }
                });

                const byHalfInning = new Map();
                records.forEach((record) => {
                    const key = `${record.side}-${record.inning}`;
                    if (!byHalfInning.has(key)) byHalfInning.set(key, []);
                    byHalfInning.get(key).push(record);
                });
                byHalfInning.forEach((halfRecords) => {
                    const last = halfRecords[halfRecords.length - 1];
                    if (last) last.inningEnd = true;
                });

                return records;
            };

            const getRoundedAdvancePath = (segments) => {
                const set = new Set(segments);
                const has1 = set.has("home-1B");
                const has2 = set.has("1B-2B");
                const has3 = set.has("2B-3B");
                const has4 = set.has("3B-score") || set.has("3B-home");
                const r = 3.2;

                // SVG coordinates trace just outside the fixed gray diamond.
                if (has1) {
                    let d = "M21.5 42 L38.3 25.2";
                    if (has2) d += " Q42 21.5 38.3 17.8 L25.2 4.7";
                    if (has3) d += " Q21.5 1 17.8 4.7 L4.7 17.8";
                    if (has4) d += " Q1 21.5 4.7 25.2 L21.5 42";
                    return d;
                }
                if (has2) {
                    let d = "M42 21.5 L38.3 17.8 L25.2 4.7";
                    if (has3) d += " Q21.5 1 17.8 4.7 L4.7 17.8";
                    if (has4) d += " Q1 21.5 4.7 25.2 L21.5 42";
                    return d;
                }
                if (has3) {
                    let d = "M21.5 1 L17.8 4.7 L4.7 17.8";
                    if (has4) d += " Q1 21.5 4.7 25.2 L21.5 42";
                    return d;
                }
                if (has4) return "M1 21.5 L4.7 25.2 L21.5 42";
                return "";
            };

            const createAdvanceSvg = (segments, className = "advance-svg") => {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "0 0 43 43");
                svg.classList.add(className);
                const d = getRoundedAdvancePath(segments);
                if (d) {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", d);
                    svg.append(path);
                }
                return svg;
            };

            const createTemplateSvg = (shape) => {
                if (!shape || shape === "ground") return null;
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "0 0 18 12");
                svg.classList.add("play-template-svg");
                const addPath = (d) => {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", d);
                    svg.append(path);
                };
                if (shape === "fly") addPath("M2 9 Q9 1 16 9");
                if (shape === "pop") addPath("M3 9 Q9 0 15 9");
                if (shape === "line") addPath("M2 6 L16 6");
                if (shape === "bunt") addPath("M9 1 L16 6 L9 11 L2 6 Z");
                return svg;
            };

            const renderPlateAppearance = (record) => {
                const card = createElement("div", `play-card template-${record.templateId}`);
                const stage = createElement("div", "diamond-stage");
                const anchorNames = ["topLeft", "topRight", "center", "bottomLeft", "bottomRight"];
                const slots = Object.fromEntries(anchorNames.map((name) => [
                    name,
                    createElement("div", `score-anchor ${name.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`)}`)
                ]));

                stage.append(createElement("div", "diamond"));
                if (record.isHit && record.segments.length) stage.append(createAdvanceSvg(record.segments));
                if (record.rbi > 0) {
                    stage.append(createElement("div", "score-symbol play-rbi", String(record.rbi)));
                }
                card.append(
                    stage,
                    ...anchorNames.map((name) => slots[name])
                );

                if (record.notation) {
                    const notationStack = createElement("div", "play-notation-stack");
                    const templateSvg = createTemplateSvg(record.shape);
                    if (templateSvg) notationStack.append(templateSvg);
                    const longClass = record.notation.length > 3 ? " long-result" : "";
                    const strikeoutClass = ["strikeout", "swinging_strikeout"].includes(record.templateId)
                        ? " strikeout-result"
                        : "";
                    notationStack.append(createElement("div", `score-symbol play-result ${record.category}-result${strikeoutClass}${longClass}`, record.notation));
                    slots.bottomRight.append(notationStack);
                }

                if (record.extra) slots.bottomLeft.append(createElement("div", "score-symbol play-extra hit-result", record.extra));
                if (record.homeRunNumber) {
                    slots.bottomLeft.append(
                        createElement("div", "score-symbol home-run-count", `${record.homeRunNumber}号`)
                    );
                }
                if (record.centerMark) {
                    const centerClass = ["●", "○"].includes(record.centerMark)
                        ? "score-symbol play-center-mark scored"
                        : "score-symbol play-center-mark out-number";
                    slots.center.append(createElement("div", centerClass, record.centerMark));
                }
                if (record.toSecond) slots.topRight.append(createElement("div", "score-symbol runner-note to-second", record.toSecond));
                if (record.toThird) slots.topLeft.append(createElement("div", "score-symbol runner-note to-third", record.toThird));
                if (record.toHome) slots.bottomLeft.append(createElement("div", "score-symbol runner-note to-home", record.toHome));
                if (record.inningEnd) card.append(createElement("div", "inning-end-mark"));
                return card;
            };

            const populateScoreGrid = () => {
                const records = buildPlateAppearanceRecords();
                records.forEach((record) => {
                    const selector = `.atbat-cell[data-side="${record.side}"][data-inning="${record.inning}"][data-order="${record.order}"] .result-box`;
                    const resultBox = dom.awaySheet.querySelector(selector);
                    if (!resultBox) return;
                    resultBox.classList.add("has-play");
                    resultBox.append(renderPlateAppearance(record));
                });
            };

            const buildScoreGrid = (side) => {
                const grid = createElement("section", "score-grid");

                ["打順", "背番号", "名前", "守", "投/打"].forEach((label) => {
                    grid.append(createElement("div", "grid-header", label));
                });

                for (let inning = 1; inning <= state.innings; inning += 1) {
                    grid.append(
                        createElement("div", "grid-header", String(inning))
                    );
                }

                statHeaders.forEach((label) => {
                    const header = createElement("div", "grid-header vertical");
                    [...label].forEach((character) => {
                        header.append(createElement("span", "", character));
                    });
                    grid.append(header);
                });

                for (let order = 1; order <= 9; order += 1) {
                    grid.append(createPlayerRow(side, order));
                }

                return grid;
            };

            const buildBenchRows = (side) => {
                const grid = createElement("section", "bench-grid");
                const pitchers = state[side].pitchers.slice(0, 5);

                const label = createElement("div", "bench-label", "P");
                grid.append(label);

                for (let row = 0; row < 5; row += 1) {
                    const pitcher = pitchers[row];
                    const person = pitcher?.person ?? {};

                    grid.append(
                        createElement(
                            "div",
                            "bench-cell",
                            pitcher?.jerseyNumber ?? ""
                        ),
                        createElement(
                            "div",
                            "bench-cell",
                            getPersonName(person)
                        ),
                        createElement(
                            "div",
                            "bench-cell",
                            pitcher?.position?.abbreviation ?? "P"
                        ),
                        createElement(
                            "div",
                            "bench-cell",
                            pitcher?.pitchHand?.code ?? ""
                        )
                    );

                    const inningBlank = createElement(
                        "div",
                        "bench-cell blank-span"
                    );

                    inningBlank.style.gridColumn = `span ${state.innings}`;
                    grid.append(inningBlank);

                    for (
                        let index = 0;
                        index < statHeaders.length;
                        index += 1
                    ) {
                        grid.append(createElement("div", "bench-cell"));
                    }
                }

                return grid;
            };

            const buildSummaryRows = (side) => {
                const grid = createElement("section", "summary-grid");

                ["安打｜四球｜三振", "得点｜残塁", "投球数｜失策"].forEach(
                    (label) => {
                        grid.append(
                            createElement(
                                "div",
                                "summary-cell summary-label",
                                label
                            )
                        );

                        for (
                            let inning = 1;
                            inning <= state.innings;
                            inning += 1
                        ) {
                            grid.append(createElement("div", "summary-cell"));
                        }

                        for (
                            let index = 0;
                            index < statHeaders.length;
                            index += 1
                        ) {
                            grid.append(createElement("div", "summary-cell"));
                        }
                    }
                );

                return grid;
            };

            const buildPitchingTable = (side) => {
                const box = createElement("section", "table-box");
                box.append(createElement("div", "table-title", `投手成績　${state[side].name}`));

                const wrap = createElement("div", "pitching-table-wrap");
                const table = createElement("table", "pitching-table");
                const thead = document.createElement("thead");
                const headRow = document.createElement("tr");

                pitchingHeaders.forEach((label, index) => {
                    const th = createElement("th", "", label);
                    if (index === 0) th.className = "pitcher-column";
                    else if (index === 1) th.className = "pitch-count-column";
                    else th.className = "stat-column";
                    headRow.append(th);
                });

                thead.append(headRow);
                table.append(thead);

                const tbody = document.createElement("tbody");
                const pitchers = state[side].pitchers.length > 0
                    ? state[side].pitchers.slice(0, 8)
                    : Array.from({ length: 4 }, () => null);

                pitchers.forEach((pitcher) => {
                    const row = document.createElement("tr");
                    const stats = pitcher?.stats?.pitching ?? {};
                    const walks = Number(stats.baseOnBalls);
                    const hitByPitch = Number(stats.hitByPitch);
                    const walksAndHitByPitch = Number.isFinite(walks) || Number.isFinite(hitByPitch)
                        ? (Number.isFinite(walks) ? walks : 0) + (Number.isFinite(hitByPitch) ? hitByPitch : 0)
                        : "";
                    const values = [
                        getPersonName(pitcher?.person),
                        stats.numberOfPitches ?? "",
                        stats.inningsPitched ?? "",
                        stats.hits ?? "",
                        stats.runs ?? "",
                        stats.earnedRuns ?? "",
                        walksAndHitByPitch,
                        stats.strikeOuts ?? "",
                        stats.era ?? ""
                    ];

                    values.forEach((value, valueIndex) => {
                        const td = createElement("td", "", String(value ?? ""));
                        if (valueIndex === 0) td.className = "pitcher-column";
                        else if (valueIndex === 1) td.className = "pitch-count-column";
                        else td.className = "stat-column";
                        row.append(td);
                    });

                    tbody.append(row);
                });

                table.append(tbody);
                wrap.append(table);
                box.append(wrap);

                return box;
            };
            const buildSideTables = () => {
                const wrapper = createElement("div", "side-stats");

                const notesBox = createElement("section", "table-box");
                notesBox.append(
                    createElement("div", "table-title", "特記事項")
                );

                const notesTable = createElement("div", "special-notes");
                for (let row = 0; row < 6; row += 1) {
                    const note = createElement("div", "special-note-row");
                    note.contentEditable = "true";
                    note.spellcheck = false;
                    note.dataset.noteRow = String(row + 1);
                    notesTable.append(note);
                }
                notesBox.append(notesTable);

                const memoBox = createElement("section", "table-box");
                memoBox.append(
                    createElement("div", "table-title", "長打・走塁記録")
                );

                const memoTable = createElement("div", "memo-table");

                ["二塁打", "三塁打", "本塁打", "盗塁", "走塁死"].forEach(
                    (label) => {
                        memoTable.append(
                            createElement("div", "memo-label", label),
                            createElement("div")
                        );
                    }
                );

                memoBox.append(memoTable);
                wrapper.append(notesBox, memoBox);

                return wrapper;
            };

            const buildTeamPanelTitle = (side) => {
                const team = state[side];
                const title = createElement("div", "team-panel-title");
                const mainLine = createElement(
                    "div",
                    "team-panel-title-main"
                );

                mainLine.append(
                    createElement(
                        "span",
                        "team-panel-title-name",
                        team.name
                    )
                );

                if (Number.isFinite(team.wins) && Number.isFinite(team.losses)) {
                    mainLine.append(
                        createElement(
                            "span",
                            "team-panel-title-record",
                            `${team.wins}-${team.losses}`
                        )
                    );
                }

                title.append(mainLine);

                if (team.division) {
                    title.append(
                        createElement(
                            "div",
                            "team-panel-title-division",
                            `（${team.division}）`
                        )
                    );
                }

                return title;
            };

            const buildTeamPanel = (side) => {
                const panel = createElement("section", "team-score-panel");

                panel.append(
                    buildTeamPanelTitle(side),
                    buildScoreGrid(side),
                    buildBenchRows(side),
                    buildSummaryRows(side)
                );

                const bottom = createElement("section", "sheet-bottom");
                bottom.append(buildPitchingTable(side), buildSideTables());
                panel.append(bottom);

                return panel;
            };

            const buildSheet = () => {
                const wrapper = createElement("div");
                wrapper.append(
                    buildScoreHeaderArea(state.gameData)
                );

                const dualLayout = createElement("section", "dual-score-layout");
                dualLayout.append(
                    buildTeamPanel("away"),
                    buildTeamPanel("home")
                );

                wrapper.append(dualLayout);
                return wrapper;
            };

            const render = () => {
                document.documentElement.style.setProperty(
                    "--inning-count",
                    String(state.innings)
                );

                dom.inningCount.textContent = String(state.innings);

                dom.awaySheet.replaceChildren(buildSheet());
                populateScoreGrid();
                dom.homeSheet.replaceChildren();
                dom.awayPage.classList.add("active");
                dom.homePage.classList.remove("active");
            };

            const updateSidebar = () => {
                dom.homeTeam.textContent = state.home.name;
                dom.awayTeam.textContent = state.away.name;
                dom.gameDate.textContent = getGameDateText(state.gameData);
                dom.ballpark.textContent =
                    getJapaneseVenueName(state.gameData);
                dom.gameStatus.textContent = getStatusText(state.gameData);
                dom.inningCount.textContent = String(state.innings);
            };

            const fetchGameData = async (gamePk) => {
                const endpoint =
                    `https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`;

                const response = await fetch(endpoint);

                if (!response.ok) {
                    throw new Error(
                        `MLBデータの取得に失敗しました（${response.status}）`
                    );
                }

                return response.json();
            };

            const loadGame = async () => {
                const gamePk = extractGamePk(dom.gameInput.value);

                if (!gamePk) {
                    setStatus(
                        "Gameday URLまたはGame PKを正しく入力してください。",
                        true
                    );
                    return;
                }

                dom.loadButton.disabled = true;
                setStatus(`Game PK ${gamePk} を取得しています…`);

                try {
                    const data = await fetchGameData(gamePk);

                    state.gamePk = gamePk;
                    state.gameData = data;
                    state.innings = determineInningCount(data);
                    state.away = getTeamState(data, "away");
                    state.home = getTeamState(data, "home");

                    updateSidebar();
                    render();

                    setStatus(
                        `${state.away.abbreviation} @ ${state.home.abbreviation} を読み込みました。` +
                        ` 実際の試合データに合わせて${state.innings}回まで生成しています。`
                    );
                } catch (error) {
                    console.error(error);
                    setStatus(error.message || "試合データを取得できません。", true);
                } finally {
                    dom.loadButton.disabled = false;
                }
            };

            const switchPage = () => {
                dom.awayPage.classList.add("active");
                dom.homePage.classList.remove("active");
                dom.awayPageButton.classList.add("active");
                dom.homePageButton.classList.remove("active");
            };

            const saveSnapshot = () => {
                const payload = {
                    version: "2.0.0",
                    savedAt: new Date().toISOString(),
                    gamePk: state.gamePk,
                    innings: state.innings,
                    away: state.away,
                    home: state.home,
                    gameData: state.gameData
                };

                localStorage.setItem(
                    "mlb-scorebook-generator-current",
                    JSON.stringify(payload)
                );

                setStatus("現在の試合データをブラウザに保存しました。");
            };

            const exportJson = () => {
                const payload = {
                    version: "2.0.0",
                    exportedAt: new Date().toISOString(),
                    gamePk: state.gamePk,
                    innings: state.innings,
                    away: state.away,
                    home: state.home,
                    gameData: state.gameData
                };

                const blob = new Blob(
                    [JSON.stringify(payload, null, 2)],
                    { type: "application/json" }
                );

                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download =
                    state.gamePk
                        ? `scorebook-${state.gamePk}.json`
                        : "scorebook.json";

                link.click();
                URL.revokeObjectURL(url);
            };

            dom.loadButton.addEventListener("click", loadGame);

            dom.generateButton.addEventListener("click", () => {
                render();
                setStatus(
                    `${state.innings}回分の早稲田式スコアブックを再生成しました。`
                );
            });

            dom.saveButton.addEventListener("click", saveSnapshot);
            dom.awayPageButton.addEventListener("click", () => switchPage("away"));
            dom.homePageButton.addEventListener("click", () => switchPage("home"));
            dom.printButton.addEventListener("click", () => window.print());
            dom.pdfButton.addEventListener("click", () => window.print());
            dom.jsonButton.addEventListener("click", exportJson);

            dom.pngButton.addEventListener("click", () => {
                setStatus(
                    "PNG出力は次の工程で実装します。現在はPRINT/PDFを使用してください。"
                );
            });

            render();
        })();
    </script>
</body>
</html>
