                        `${state.away.abbreviation} @ ${state.home.abbreviation} を読み込みました。` +
                        ` 実際の試合データに合わせて${state.innings}回まで生成しています。`
                    );
                } catch (error) {
                    console.error(error);
                    setStatus(error.message || "試合データを取得できません。", true);
                } finally {
                    dom.loadButton.disabled = false;
                }
            };

            const switchPage = () => {
                dom.awayPage.classList.add("active");
                dom.homePage.classList.remove("active");
                dom.awayPageButton.classList.add("active");
                dom.homePageButton.classList.remove("active");
            };

            const saveSnapshot = () => {
                const payload = {
                    version: "2.0.0",
                    savedAt: new Date().toISOString(),
                    gamePk: state.gamePk,
                    innings: state.innings,
                    inningColumns: state.inningColumns,
                    away: state.away,
                    home: state.home,
                    gameData: state.gameData
                };

                localStorage.setItem(
                    "mlb-scorebook-generator-current",
                    JSON.stringify(payload)
                );

                setStatus("現在の試合データをブラウザに保存しました。");
            };

            const PRINT_PAGE_STYLE_ID = "print-a3-landscape-page";
            const PRINT_STAGE_ID = "scorebook-print-stage";
            const A3_LANDSCAPE_WIDTH_MM = 420;
            const A3_LANDSCAPE_HEIGHT_MM = 297;
            const PRINT_MARGIN_MM = 6;
            const CSS_PIXELS_PER_MM = 96 / 25.4;

            const clearPrintFit = () => {
                document.body.classList.remove("print-stage-active");
                document.getElementById(PRINT_STAGE_ID)?.remove();
                document.getElementById(PRINT_PAGE_STYLE_ID)?.remove();
            };

            const preparePrintFit = () => {
                clearPrintFit();
                const content = dom.awaySheet.firstElementChild;
                if (!content) return false;

                const printableWidth = (
                    A3_LANDSCAPE_WIDTH_MM - PRINT_MARGIN_MM * 2
                ) * CSS_PIXELS_PER_MM;
                const printableHeight = (
                    A3_LANDSCAPE_HEIGHT_MM - PRINT_MARGIN_MM * 2
                ) * CSS_PIXELS_PER_MM;
                const contentWidth = Math.max(
                    content.scrollWidth,
                    content.getBoundingClientRect().width
                );
                const contentHeight = Math.max(
                    content.scrollHeight,
                    content.getBoundingClientRect().height
                );
                if (!(contentWidth > 0 && contentHeight > 0)) return false;

                const scale = Math.min(
                    1,
                    printableWidth / contentWidth,
                    printableHeight / contentHeight
                );
                const printStage = document.createElement("section");
                printStage.id = PRINT_STAGE_ID;
                printStage.setAttribute("aria-hidden", "true");
                printStage.style.setProperty("--print-scale", String(scale));
                printStage.style.setProperty(
                    "--print-output-width",
                    `${contentWidth * scale}px`
                );
                printStage.style.setProperty(
                    "--print-output-height",
                    `${contentHeight * scale}px`
                );

                const printContent = document.createElement("div");
                printContent.className = "scorebook-print-content";
                printContent.style.width = `${contentWidth}px`;
                printContent.style.height = `${contentHeight}px`;
                printContent.append(content.cloneNode(true));
                printStage.append(printContent);
                document.body.append(printStage);
                document.body.classList.add("print-stage-active");

                const pageStyle = document.createElement("style");
                pageStyle.id = PRINT_PAGE_STYLE_ID;
                pageStyle.textContent = `@page { size: A3 landscape; margin: ${PRINT_MARGIN_MM}mm; }`;
                document.head.append(pageStyle);
                return true;
            };

            const printFullScorebook = () => {
                if (!preparePrintFit()) {
                    setStatus("印刷対象を生成してからPRINTを実行してください。", true);
                    return;
                }
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => window.print());
                });
            };

            const exportJson = () => {
                const payload = {
                    version: "2.0.0",
                    exportedAt: new Date().toISOString(),
                    gamePk: state.gamePk,
                    innings: state.innings,
                    inningColumns: state.inningColumns,
                    away: state.away,
                    home: state.home,
                    gameData: state.gameData
                };

                const blob = new Blob(
                    [JSON.stringify(payload, null, 2)],
                    { type: "application/json" }
                );

                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download =
                    state.gamePk
                        ? `scorebook-${state.gamePk}.json`
                        : "scorebook.json";

                link.click();
                URL.revokeObjectURL(url);
            };

            dom.loadButton.addEventListener("click", loadGame);

            dom.generateButton.addEventListener("click", async () => {
                if (state.gameData && state.gamePk) {
                    [state.streakNotes, state.headToHead] = await Promise.all([
                        fetchStreakNotes(state.gameData, state.gamePk),
                        fetchHeadToHeadRecord(state.gameData, state.gamePk)
                    ]);
                }
                render();
                setStatus(
                    `${state.innings}回分の早稲田式スコアブックを再生成しました。`
                );
            });

            dom.saveButton.addEventListener("click", saveSnapshot);
            dom.awayPageButton.addEventListener("click", () => switchPage("away"));
            dom.homePageButton.addEventListener("click", () => switchPage("home"));
            dom.printButton.addEventListener("click", printFullScorebook);
            dom.pdfButton.addEventListener("click", () => window.print());
            dom.jsonButton.addEventListener("click", exportJson);

            dom.pngButton.addEventListener("click", () => {
                setStatus(
                    "PNG出力は次の工程で実装します。現在はPRINT/PDFを使用してください。"
                );
            });

            window.addEventListener("afterprint", clearPrintFit);

            render();
        })();
    </script>
</body>
</html>
