<!DOCTYPE html>
<!-- TEST -->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Scorebook Generator</title>
    <!-- Score notation update: stacked batted-ball symbol, red hits, blue strikeouts, black other results. -->
    <link rel="stylesheet" href="css/style.css?v=20260801-15">
</head>

<body>
    <header class="app-header">
        <div class="app-title">
            <h1>MLB SCOREBOOK GENERATOR</h1>
            <p aria-hidden="true">&nbsp;</p>
        </div>

        <div class="version">Ver. 2.3.2</div>
    </header>

    <main class="app-main">
        <aside class="sidebar">
            <h2>Game Data</h2>

            <label for="gameday-url">MLB Gameday URL / Game PK</label>
            <input
                type="text"
                id="gameday-url"
                placeholder="https://www.mlb.com/gameday/... または gamePk">

            <button id="load-btn">試合データを取得</button>
            <button id="generate-btn">スコアブック生成</button>
            <button id="save-btn">保存</button>

            <div class="status-message" id="status-message">
                初期表示は9回です。Gameday取得後は実際のイニング数に合わせて自動拡張します。
            </div>

            <hr>

            <h3>Page</h3>

            <div class="page-switch">
                <button id="away-page-btn" class="active">先攻</button>
                <button id="home-page-btn">後攻</button>
            </div>

            <hr>

            <h3>Game Information</h3>

            <div class="game-info">
                <div class="info-row">
                    <span>HOME</span>
                    <span id="home-team">-</span>
                </div>

                <div class="info-row">
                    <span>AWAY</span>
                    <span id="away-team">-</span>
                </div>

                <div class="info-row">
                    <span>DATE</span>
                    <span id="game-date">-</span>
                </div>

                <div class="info-row">
                    <span>BALLPARK</span>
                    <span id="ballpark">-</span>
                </div>

                <div class="info-row">
                    <span>STATUS</span>
                    <span id="game-status">-</span>
                </div>

                <div class="info-row">
                    <span>INNINGS</span>
                    <span id="inning-count-display">9</span>
                </div>
            </div>

            <hr>

            <h3>Scorebook Library</h3>
            <div id="library-list"></div>
        </aside>

        <section class="viewer">
            <article class="paper scorebook-page active" id="away-page">
                <div id="away-sheet"></div>
            </article>

            <article class="paper scorebook-page" id="home-page">
                <div id="home-sheet"></div>
            </article>
        </section>
    </main>

    <footer class="app-footer">
        <button type="button" id="pdf-btn">PDF</button>
        <button type="button" id="png-btn">PNG</button>
        <button type="button" id="print-btn">PRINT</button>
        <button type="button" id="json-btn">JSON</button>
    </footer>

    <script src="js/players.js"></script>

            const normalizeLookupKey = (value) => {
                return String(value ?? "")
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase()
                    .replace(/[^a-z0-9]/g, "");
            };

            const getNhkTeamName = (team) => {
                const candidates = [
                    team?.name,
                    team?.teamName,
                    team?.clubName,
                    team?.shortName
                ];

                for (const candidate of candidates) {
                    const converted = NHK_TEAM_NAMES[normalizeLookupKey(candidate)];

                    if (converted) {
                        return converted;
                    }
                }

                return team?.name || team?.teamName || team?.clubName || "";
            };

            const getJapaneseVenueName = (data) => {
                const venueName = data?.gameData?.venue?.name ?? "";
                const key = normalizeLookupKey(venueName);

                return JAPANESE_VENUE_NAMES[key] || venueName || "-";
            };

            const translateWeatherCondition = (condition) => {
                const raw = String(condition ?? "").trim();
                const key = normalizeLookupKey(raw);

                if (!raw) {
                    return "";
                }

                return JAPANESE_WEATHER_CONDITIONS[key] || raw;
            };

            const fahrenheitToCelsius = (fahrenheit) => {
                const value = Number(fahrenheit);

                if (!Number.isFinite(value)) {
                    return "";
                }

                return `${Math.round((value - 32) * 5 / 9)}℃`;
            };

            const isGameFinal = (data) => {
                const status = data?.gameData?.status;
                const abstractState = String(status?.abstractGameState ?? "").toLowerCase();
                const codedState = String(status?.codedGameState ?? "").toUpperCase();

                return abstractState === "final" || ["F", "O"].includes(codedState);
            };

            const shouldShowNoBottomMark = (side, inningNumber) => {
                if (side !== "home" || inningNumber !== state.innings || !isGameFinal(state.gameData)) {
                    return false;
                }

                const awayRuns = Number(getTeamTotal("away", "runs"));
                const homeRuns = Number(getTeamTotal("home", "runs"));

                if (!Number.isFinite(awayRuns) || !Number.isFinite(homeRuns) || homeRuns <= awayRuns) {
                    return false;
                }

                const plays = state.gameData?.liveData?.plays?.allPlays ?? [];
                const bottomHalfWasPlayed = plays.some((play) => {
                    return Number(play?.about?.inning) === inningNumber &&
                        Boolean(play?.about?.isTopInning) === false;
                });

                return !bottomHalfWasPlayed;
            };

            const state = {
                innings: DEFAULT_INNINGS,
                gamePk: null,
                gameData: null,
                inningColumns: Object.fromEntries(
                    ["away", "home"].map((side) => [
                        side,
                        Array.from(
                            { length: DEFAULT_INNINGS },
                            (_, index) => ({ inning: index + 1, occurrence: 1 })
                        )
                    ])
                ),
                headToHead: null,
                streakNotes: { away: [], home: [] },
                defensivePositionHistory: { away: {}, home: {} },
                away: {

                    pitchers: []

                    name: "後攻チーム",
                    players: [],
                    pitchers: []
                }
            };

                pdfButton: document.getElementById("pdf-btn"),

            const createElement = (tagName, className = "", text = "") => {
                const element = document.createElement(tagName);

                if (className) {
                    element.className = className;
                }

                if (text !== "") {
                    element.textContent = text;
                }

                return element;
            };

            const setStatus = (message, isError = false) => {
                dom.statusMessage.textContent = message;
                dom.statusMessage.style.color = isError ? "#ffb4b4" : "#b8c4ca";
            };

            const extractGamePk = (value) => {
                const trimmed = value.trim();

                if (/^\d+$/.test(trimmed)) {
                    return trimmed;
                }

                const directMatch = trimmed.match(/gamePk[=\/](\d+)/i);

                if (directMatch) {
                    return directMatch[1];
                }

                const gamedayMatch = trimmed.match(/gameday\/[^/]*-(\d+)(?:[/?#]|$)/i);

                if (gamedayMatch) {
                    return gamedayMatch[1];
                }

                const numbers = trimmed.match(/\d{6,}/g);

                return numbers ? numbers[numbers.length - 1] : null;
            };

            const clampInningCount = (value) => {
                const numeric = Number(value);

                if (!Number.isFinite(numeric)) {
                    return DEFAULT_INNINGS;
                }

                return Math.min(
                    MAX_SAFE_INNINGS,
                    Math.max(MIN_INNINGS, Math.ceil(numeric))
                );
            };

            const determineInningCount = (data) => {
                const linescoreInnings =
                    data?.liveData?.linescore?.innings?.length ?? 0;

                const currentInning =
                    data?.liveData?.linescore?.currentInning ?? 0;

                const plays = data?.liveData?.plays?.allPlays ?? [];

                const playInning = plays.reduce((max, play) => {
                    const inning = play?.about?.inning ?? 0;
                    return Math.max(max, inning);
                }, 0);

                const scheduledInnings =
                    data?.gameData?.game?.scheduledInnings ?? DEFAULT_INNINGS;

                return clampInningCount(
                    Math.max(
                        scheduledInnings,
                        linescoreInnings,
                        currentInning,
                        playInning
                    )
                );
            };

            const determineInningColumns = (data, inningCount) => {
                const plateAppearances = new Map();
                (data?.liveData?.plays?.allPlays ?? []).forEach((play) => {
                    if (!play?.matchup?.batter?.id) return;
                    const side = play?.about?.halfInning === "top" ? "away" : "home";
                    const inning = Number(play?.about?.inning);
                    if (!inning) return;
                    const key = `${side}-${inning}`;
                    plateAppearances.set(key, (plateAppearances.get(key) ?? 0) + 1);
                });

                return Object.fromEntries(["away", "home"].map((side) => {
                    const columns = [];
                    for (let inning = 1; inning <= inningCount; inning += 1) {
                        const appearances = plateAppearances.get(`${side}-${inning}`) ?? 0;
                        const columnCount = Math.max(1, Math.ceil(appearances / 9));
                        for (let occurrence = 1; occurrence <= columnCount; occurrence += 1) {
                            columns.push({ inning, occurrence });
                        }
                    }
                    return [side, columns];
                }));
            };

                    [person?.firstName, person?.lastName].filter(Boolean).join(" ")

                    const converted = NHK_PLAYER_NAMES[normalizeLookupKey(candidate)];

                    if (converted) {
                        return converted;

                return (

                    person?.nameFirstLast ||

                const url = getMlbPlayerPageUrl(person);
                if (!url) return createElement("span", "", text);
                const link = createElement("a", "player-profile-link", text);
                link.href = url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                return link;
            };

            const getMlbGamedayAtBatUrl = (gamePk, atBatIndex) => {
                if (gamePk == null || gamePk === "" || atBatIndex == null || atBatIndex === "") {
                    return "";

                const numericGamePk = Number(gamePk);
                const numericAtBatIndex = Number(atBatIndex);
                return Number.isInteger(numericGamePk) && numericGamePk > 0 &&
                    Number.isInteger(numericAtBatIndex) && numericAtBatIndex >= 0
                    ? `https://www.mlb.com/gameday/${numericGamePk}/play/${numericAtBatIndex}`
                    : "";
            };

            const createGamedayAtBatResult = (text, className, atBatIndex) => {
                const url = getMlbGamedayAtBatUrl(state.gamePk, atBatIndex);

                const link = createElement("a", `${className} gameday-atbat-link`, text);

                link.rel = "noopener noreferrer";
                link.setAttribute("aria-label", `${text}のMLB Gameday打席詳細を新しいタブで開く`);

                if (teamOrCode && typeof teamOrCode === "object") {

                        teamOrCode?.abbreviation ||
                        "";
                    return MLB_TEAM_CODE_ALIASES[String(rawCode).toUpperCase()] ||
                        String(rawCode).toUpperCase();
                }
                const rawCode = String(teamOrCode ?? "").toUpperCase();
                return MLB_TEAM_CODE_ALIASES[rawCode] || rawCode;
            };

            const streakNotesCache = new Map();
            const playerGameLogCache = new Map();
            const playerCareerStreakCache = new Map();
            const teamScheduleCache = new Map();
            const gameBoxscoreCache = new Map();
            const activeRosterCache = new Map();
            const playerCareerStatsCache = new Map();
            const headToHeadCache = new Map();
            const teamFirstYearCache = new Map();

            const CAREER_MILESTONE_DEFINITIONS = Object.freeze({
                hitting: [
                    { field: "hits", currentField: "hits", label: "安打", marks: [500, 1000, 1500, 2000, 2500, 3000] },
                    { field: "homeRuns", currentField: "homeRuns", label: "本塁打", marks: [100, 200, 300, 400, 500, 600, 700] },
                    { field: "rbi", currentField: "rbi", label: "打点", marks: [500, 1000, 1500, 2000] },
                    { field: "stolenBases", currentField: "stolenBases", label: "盗塁", marks: [100, 200, 300, 400, 500] },
                    { field: "runs", currentField: "runs", label: "得点", marks: [500, 1000, 1500, 2000] },
                    { field: "gamesPlayed", currentField: "gamesPlayed", label: "試合出場", marks: [500, 1000, 1500, 2000, 2500, 3000] }
                ],
                pitching: [
                    { field: "wins", currentField: "wins", label: "勝利", marks: [50, 100, 150, 200, 250, 300] },
                    { field: "strikeOuts", currentField: "strikeOuts", label: "奪三振", marks: [500, 1000, 1500, 2000, 2500, 3000] },
                    { field: "gamesPlayed", currentField: "gamesPlayed", label: "登板", marks: [100, 250, 500, 750, 1000] },
                    { field: "saves", currentField: "saves", label: "セーブ", marks: [50, 100, 150, 200, 250, 300, 400, 500, 600] },
                    { field: "holds", currentField: "holds", label: "ホールド", marks: [50, 100, 150, 200] }
                ]
            });

            const getPlateAppearances = (stat = {}) => {
                const officialValue = Number(stat.plateAppearances);
                if (Number.isFinite(officialValue)) return officialValue;
                return ["atBats", "baseOnBalls", "hitByPitch", "sacFlies", "sacBunts"]
                    .reduce((total, field) => total + (Number(stat[field]) || 0), 0);
            };

            const fetchPlayerRegularSeasonGameLog = async (playerId, season, group = "hitting") => {
                const cacheKey = `${playerId}:${season}:${group}`;
                if (playerGameLogCache.has(cacheKey)) {
                    return playerGameLogCache.get(cacheKey);
                }

                const request = fetch(
                    `https://statsapi.mlb.com/api/v1/people/${playerId}/stats` +
                    `?stats=gameLog&group=${group}&season=${season}&gameType=R`
                ).then(async (response) => {
                    if (!response.ok) return [];
                    const payload = await response.json();
                    return payload?.stats?.[0]?.splits ?? [];
                }).catch(() => []);

                playerGameLogCache.set(cacheKey, request);
                return request;
            };

            const fetchPlayerCareerStats = async (player, group, officialDate) => {
                const playerId = Number(player?.id);
                const debutDate = String(player?.person?.mlbDebutDate ?? "");
                if (!Number.isFinite(playerId) || !/^\d{4}-\d{2}-\d{2}$/.test(debutDate)) {
                    return null;
                }
                const cacheKey = `${playerId}:${group}:${officialDate}`;
                if (playerCareerStatsCache.has(cacheKey)) {
                    return playerCareerStatsCache.get(cacheKey);
                }

                const request = fetch(
                    `https://statsapi.mlb.com/api/v1/people/${playerId}/stats` +
                    `?stats=byDateRange&group=${group}&gameType=R` +
                    `&startDate=${debutDate}&endDate=${officialDate}`
                ).then(async (response) => {
                    if (!response.ok) return null;
                    const payload = await response.json();
                    return payload?.stats?.[0]?.splits?.[0]?.stat ?? null;
                }).catch(() => null);

                playerCareerStatsCache.set(cacheKey, request);
                return request;
            };

            const calculateLongestStreaks = (splits, excludedGamePk) => {
                const games = splits
                    .filter((split) => Number(split?.game?.gamePk) !== Number(excludedGamePk))
                    .sort((a, b) => String(a?.date ?? "").localeCompare(String(b?.date ?? "")) ||
                        (Number(a?.game?.gameNumber) || Number(a?.game?.gamePk) || 0) -
                        (Number(b?.game?.gameNumber) || Number(b?.game?.gamePk) || 0));
                let hit = 0;
                let onBase = 0;
                let longestHit = 0;
                let longestOnBase = 0;

                games.forEach((split) => {
                    const stat = split?.stat ?? {};
                    if (getPlateAppearances(stat) <= 0) return;
                    const hits = Number(stat?.hits) || 0;
                    const reached = hits +
                        (Number(stat?.baseOnBalls) || 0) +
                        (Number(stat?.hitByPitch) || 0);
                    hit = hits > 0 ? hit + 1 : 0;
                    onBase = reached > 0 ? onBase + 1 : 0;
                    longestHit = Math.max(longestHit, hit);
                    longestOnBase = Math.max(longestOnBase, onBase);
                });
                return { hit: longestHit, onBase: longestOnBase };
            };

            const fetchPlayerCareerBestStreaks = async (player, season, currentGamePk) => {
                const debutYear = Number(String(player?.person?.mlbDebutDate ?? "").slice(0, 4));
                if (!Number.isFinite(debutYear) || debutYear > season) return null;
                const cacheKey = `${player.id}:${season}:${currentGamePk}`;
                if (playerCareerStreakCache.has(cacheKey)) {
                    return playerCareerStreakCache.get(cacheKey);
                }

                const request = mapWithConcurrency(
                    Array.from({ length: season - debutYear + 1 }, (_, index) => debutYear + index),
                    4,
                    (year) => fetchPlayerRegularSeasonGameLog(player.id, year)
                ).then((yearlySplits) => calculateLongestStreaks(
                    yearlySplits.flat(),
                    currentGamePk
                )).catch(() => null);
                playerCareerStreakCache.set(cacheKey, request);
                return request;
            };

            const getPersonalStreakSuffix = (current, previousBest, stopped) => {
                if (stopped || !Number.isFinite(previousBest) || previousBest < 1) return "";
                if (current > previousBest) return "（自己最長更新）";
                if (current === previousBest) return "（自己最長タイ）";
                const remaining = previousBest - current;
                return remaining >= 1 && remaining <= 2
                    ? `（自己最長${previousBest}まであと${remaining}）`
                    : "";
            };

            const buildCareerMilestoneNotes = async (players, code, officialDate) => {
                const notes = await mapWithConcurrency(players, 8, async (player) => {
                    const primaryPosition = normalizePositionAbbreviation(
                        player?.person?.primaryPosition
                    );
                    const groups = player?.rosterPosition === "TWP" || primaryPosition === "TWP"
                        ? ["hitting", "pitching"]
                        : isPitcherCandidate(player) ? ["pitching"] : ["hitting"];
                    const playerNotes = [];

                    for (const group of groups) {
                        const career = await fetchPlayerCareerStats(player, group, officialDate);
                        if (!career) continue;
                        const current = group === "pitching"
                            ? player.currentGamePitching
                            : player.currentGameBatting;

                        CAREER_MILESTONE_DEFINITIONS[group].forEach((definition) => {
                            const total = Number(career?.[definition.field]);
                            if (!Number.isFinite(total)) return;
                            const gameValue = Number(current?.[definition.currentField]) || 0;
                            const beforeGame = Math.max(0, total - gameValue);
                            const achieved = definition.marks.find((mark) =>
                                beforeGame < mark && total >= mark
                            );
                            const next = definition.marks.find((mark) => mark > total);
                            const playerName = getPersonName(player.person);

                            if (achieved) {
                                playerNotes.push({
                                    text: `${code}　${playerName}　通算${achieved}${definition.label}達成`,
                                    priority: 0,
                                    importance: achieved
                                });
                                return;
                            }
                            if (next) {
                                const remaining = next - total;
                                if (remaining >= 1 && remaining <= 5) {
                                    playerNotes.push({
                                        text: `${code}　${playerName}　通算${next}${definition.label}まであと${remaining}`,
                                        priority: 4,
                                        importance: 6 - remaining
                                    });
                                }
                            }
                        });
                    }
                    return playerNotes;
                });

                return notes.flat().sort((a, b) =>
                    a.priority - b.priority || b.importance - a.importance
                );
            };

            const fetchActiveRoster = async (teamId, officialDate) => {
                const cacheKey = `${teamId}:${officialDate}`;
                if (activeRosterCache.has(cacheKey)) return activeRosterCache.get(cacheKey);
                const request = fetch(
                    `https://statsapi.mlb.com/api/v1/teams/${teamId}/roster` +
                    `?rosterType=active&date=${officialDate}&hydrate=person`
                ).then(async (response) => {
                    if (!response.ok) return [];
                    const payload = await response.json();
                    return (payload?.roster ?? []).filter((entry) =>
                        String(entry?.status?.code ?? "A").toUpperCase() === "A"
                    );
                }).catch(() => []);
                activeRosterCache.set(cacheKey, request);
                return request;
            };

            const fetchTeamRegularSeasonSchedule = async (teamId, season, officialDate) => {
                const cacheKey = `${teamId}:${season}:${officialDate}`;
                if (teamScheduleCache.has(cacheKey)) return teamScheduleCache.get(cacheKey);

                const params = new URLSearchParams({
                    sportId: "1",
                    teamId: String(teamId),
                    startDate: `${season}-02-01`,
                    endDate: officialDate,
                    gameType: "R"
                });
                const request = fetch(`https://statsapi.mlb.com/api/v1/schedule?${params}`)
                    .then(async (response) => {
                        if (!response.ok) return [];
                        const payload = await response.json();
                        return (payload?.dates ?? [])
                            .flatMap((date) => date?.games ?? [])
                            .filter((game) => String(game?.gameType ?? "").toUpperCase() === "R")
                            .filter((game) => String(game?.status?.abstractGameState ?? "").toLowerCase() === "final")
                            .sort((a, b) => String(a?.gameDate ?? "").localeCompare(String(b?.gameDate ?? "")) ||
                                (Number(a?.gameNumber) || 0) - (Number(b?.gameNumber) || 0));
                    })
                    .catch(() => []);
                teamScheduleCache.set(cacheKey, request);
                return request;
            };

            const getEmptyHeadToHeadRecord = () => ({
                awaySeason: null,
                homeSeason: null,
                awayCareer: null,
                homeCareer: null
            });

            const fetchHeadToHeadSchedule = async (
                teamId,
                opponentId,
                startDate,
                endDate
            ) => {
                const params = new URLSearchParams({
                    sportId: "1",
                    teamId: String(teamId),
                    opponentId: String(opponentId),
                    startDate,
                    endDate,
                    gameType: "R"
                });
                const controller = new AbortController();
                const timeoutId = window.setTimeout(() => controller.abort(), 12000);
                try {
                    const response = await fetch(
                        `https://statsapi.mlb.com/api/v1/schedule?${params}`,
                        { signal: controller.signal }
                    );
                    if (!response.ok) return null;
                    const payload = await response.json();
                    return (payload?.dates ?? [])
                        .flatMap((date) => date?.games ?? [])
                        .filter((game) => String(game?.gameType ?? "").toUpperCase() === "R")
                        .filter((game) => String(game?.status?.abstractGameState ?? "")
                            .toLowerCase() === "final");
                } catch {
                    return null;
                } finally {
                    window.clearTimeout(timeoutId);
                }
            };

            const countHeadToHeadWins = (games, awayTeamId, homeTeamId) => {
                if (!Array.isArray(games)) return null;
                const wins = { [awayTeamId]: 0, [homeTeamId]: 0 };
                games.forEach((game) => {
                    const away = game?.teams?.away ?? {};
                    const home = game?.teams?.home ?? {};
                    let winnerId = null;
                    if (away?.isWinner === true) winnerId = Number(away?.team?.id);
                    else if (home?.isWinner === true) winnerId = Number(home?.team?.id);
                    else {
                        const awayScore = Number(away?.score);
                        const homeScore = Number(home?.score);
                        if (Number.isFinite(awayScore) && Number.isFinite(homeScore) &&
                            awayScore !== homeScore) {
                            winnerId = awayScore > homeScore
                                ? Number(away?.team?.id)
                                : Number(home?.team?.id);
                        }
                    }
                    if (Object.prototype.hasOwnProperty.call(wins, winnerId)) wins[winnerId] += 1;
                });
                return wins;
            };

            const fetchTeamFirstYear = async (teamId) => {
                const cacheKey = String(teamId);
                if (teamFirstYearCache.has(cacheKey)) return teamFirstYearCache.get(cacheKey);
                const request = fetch(`https://statsapi.mlb.com/api/v1/teams/${teamId}`)
                    .then(async (response) => {
                        if (!response.ok) return null;
                        const payload = await response.json();
                        const year = Number(payload?.teams?.[0]?.firstYearOfPlay);
                        return Number.isFinite(year) ? year : null;
                    }).catch(() => null);
                teamFirstYearCache.set(cacheKey, request);
                return request;
            };

            const fetchCareerHeadToHeadSchedule = async (
                awayTeamId,
                homeTeamId,
                officialDate
            ) => {
                const [awayFirstYear, homeFirstYear] = await Promise.all([
                    fetchTeamFirstYear(awayTeamId),
                    fetchTeamFirstYear(homeTeamId)
                ]);
                if (!Number.isFinite(awayFirstYear) || !Number.isFinite(homeFirstYear)) {
                    return null;
                }
                const firstYear = Math.max(awayFirstYear, homeFirstYear);
                const finalYear = Number(officialDate.slice(0, 4));
                const ranges = [];
                for (let year = firstYear; year <= finalYear; year += 1) {
                    ranges.push({
                        startDate: `${year}-01-01`,
                        endDate: year === finalYear
                            ? officialDate
                            : `${year}-12-31`
                    });
                }
                const results = await mapWithConcurrency(ranges, 8, (range) =>
                    fetchHeadToHeadSchedule(
                        awayTeamId,
                        homeTeamId,
                        range.startDate,
                        range.endDate
                    )
                );
                return results.some((games) => !Array.isArray(games))
                    ? null
                    : results.flat();
            };

            const fetchHeadToHeadRecord = async (data, gamePk) => {
                const awayTeam = data?.gameData?.teams?.away ?? {};
                const homeTeam = data?.gameData?.teams?.home ?? {};
                const awayTeamId = Number(awayTeam?.id);
                const homeTeamId = Number(homeTeam?.id);
                const officialDate = String(data?.gameData?.datetime?.officialDate ?? "");
                const season = Number(data?.gameData?.game?.season) || Number(officialDate.slice(0, 4));
                if (!awayTeamId || !homeTeamId || !officialDate || !season) {
                    return getEmptyHeadToHeadRecord();
                }

                const cacheKey = `${gamePk}:${isGameFinal(data) ? "final" : "pregame"}`;
                if (headToHeadCache.has(cacheKey)) return headToHeadCache.get(cacheKey);
                const request = Promise.all([
                    fetchHeadToHeadSchedule(
                        awayTeamId,
                        homeTeamId,
                        `${season}-01-01`,
                        officialDate
                    ),
                    fetchCareerHeadToHeadSchedule(
                        awayTeamId,
                        homeTeamId,
                        officialDate
                    )
                ]).then(([seasonGames, careerGames]) => {
                    const seasonWins = countHeadToHeadWins(
                        seasonGames,
                        awayTeamId,
                        homeTeamId
                    );
                    const careerWins = countHeadToHeadWins(
                        careerGames,
                        awayTeamId,
                        homeTeamId
                    );
                    return {
                        awaySeason: seasonWins?.[awayTeamId] ?? null,
                        homeSeason: seasonWins?.[homeTeamId] ?? null,
                        awayCareer: careerWins?.[awayTeamId] ?? null,
                        homeCareer: careerWins?.[homeTeamId] ?? null
                    };
                }).catch(() => getEmptyHeadToHeadRecord());
                headToHeadCache.set(cacheKey, request);
                return request;
            };

            const getCurrentGameParticipation = (data, side) => {
                const appeared = new Set();
                const teamData = data?.liveData?.boxscore?.teams?.[side] ?? {};
                Object.values(teamData?.players ?? {}).forEach((player) => {
                    const playerId = Number(player?.person?.id);
                    const batting = player?.stats?.batting ?? {};
                    const pitching = player?.stats?.pitching ?? {};
                    const fielding = player?.stats?.fielding ?? {};
                    const rawOrder = Number.parseInt(player?.battingOrder, 10);
                    const didAppear = Number(batting?.gamesPlayed) > 0 ||
                        Number(pitching?.gamesPlayed) > 0 ||
                        Number(fielding?.gamesStarted) > 0 ||
                        getPlateAppearances(batting) > 0 ||
                        (Number.isFinite(rawOrder) && rawOrder % 100 === 0);
                    if (playerId && didAppear) appeared.add(playerId);
                });

                (data?.liveData?.plays?.allPlays ?? []).forEach((play) => {
                    const battingSide = play?.about?.halfInning === "top" ? "away" : "home";
                    const fieldingSide = battingSide === "away" ? "home" : "away";
                    if (battingSide === side) {
                        const batterId = Number(play?.matchup?.batter?.id);
                        if (batterId) appeared.add(batterId);
                        (play?.runners ?? []).forEach((runner) => {
                            const runnerId = Number(runner?.details?.runner?.id);
                            if (runnerId) appeared.add(runnerId);
                        });
                    }
                    if (fieldingSide === side) {
                        const pitcherId = Number(play?.matchup?.pitcher?.id);
                        if (pitcherId) appeared.add(pitcherId);
                    }
                    (play?.playEvents ?? []).forEach((event) => {
                        const role = getSubstitutionRole(event?.details);
                        const playerId = Number(event?.player?.id);
                        if (!role || !playerId) return;
                        const eventSide = ["pitcher", "defense"].includes(role)
                            ? fieldingSide
                            : battingSide;
                        if (eventSide === side) appeared.add(playerId);
                    });
                });
                return { appeared };
            };

            const fetchGameBoxscore = async (gamePk) => {
                const cacheKey = String(gamePk);
                if (gameBoxscoreCache.has(cacheKey)) return gameBoxscoreCache.get(cacheKey);
                const request = fetch(`https://statsapi.mlb.com/api/v1/game/${gamePk}/boxscore`)
                    .then(async (response) => response.ok ? response.json() : null)
                    .catch(() => null);
                gameBoxscoreCache.set(cacheKey, request);
                return request;
            };

            const mapWithConcurrency = async (items, limit, mapper) => {
                const results = new Array(items.length);
                let nextIndex = 0;
                const workers = Array.from(
                    { length: Math.min(limit, items.length) },
                    async () => {
                        while (nextIndex < items.length) {
                            const index = nextIndex;
                            nextIndex += 1;
                            results[index] = await mapper(items[index], index);
                        }
                    }
                );
                await Promise.all(workers);
                return results;
            };

            const isPlayerStarterInBoxscore = (boxscore, teamId, playerId) => {
                for (const side of ["away", "home"]) {
                    const team = boxscore?.teams?.[side];
                    if (Number(team?.team?.id) !== Number(teamId)) continue;
                    const player = team?.players?.[`ID${playerId}`];
                    const battingOrder = Number.parseInt(player?.battingOrder, 10);
                    return Number.isFinite(battingOrder) && battingOrder % 100 === 0;
                }
                return false;
            };

            const isJapanesePlayer = (person) =>
                [person?.birthCountry, person?.country]
                    .some((country) => String(country ?? "").trim().toLowerCase() === "japan");

            const getScheduleOpponentCode = (game, teamId) => {
                const away = game?.teams?.away?.team ?? {};
                const home = game?.teams?.home?.team ?? {};
                return getMlbTeamDisplayCode(Number(away?.id) === Number(teamId) ? home : away);
            };

            const getScheduleReferenceText = (game, teamId) => {
                if (!game) return "";
                const dateText = String(game?.officialDate ?? game?.gameDate ?? "").slice(0, 10);
                const [, month, day] = dateText.split("-");
                const opponent = getScheduleOpponentCode(game, teamId);
                if (!month || !day || !opponent) return "";
                return `（${Number(month)}月${Number(day)}日 vs ${opponent}以来）`;
            };

            const getAbsenceNotes = async (
                players,
                schedule,
                appearedIds,
                currentGamePk,
                teamId,
                code
            ) => {
                const scheduleGamePks = new Set(schedule.map((game) => Number(game?.gamePk)));
                const preliminary = players.map((player) => {
                    if (appearedIds.has(player.id)) return null;
                    const appearances = (player.gameLogSplits ?? []).filter((split) =>
                        scheduleGamePks.has(Number(split?.game?.gamePk))
                    );
                    const appearanceGamePks = new Set(
                        appearances.map((split) => Number(split?.game?.gamePk))
                    );

                    let gamesSinceAbsence = 0;
                    let previousAbsenceGame = null;
                    const previousGames = schedule
                        .filter((game) => Number(game?.gamePk) !== Number(currentGamePk))
                        .reverse();
                    for (const game of previousGames) {
                        if (!appearanceGamePks.has(Number(game?.gamePk))) {
                            previousAbsenceGame = game;
                            break;
                        }
                        gamesSinceAbsence += 1;
                    }
                    const japanese = isJapanesePlayer(player.person);
                    if (!japanese && (schedule.length < 30 ||
                        appearanceGamePks.size / schedule.length < 0.85)) return null;
                    return {
                        ...player,
                        appearanceGamePks,
                        gamesSinceAbsence,
                        previousAbsenceGame,
                        japanese
                    };
                }).filter(Boolean);

                const requiredGamePks = [...new Set(
                    preliminary
                        .filter((player) => !player.japanese)
                        .flatMap((player) => [...player.appearanceGamePks])
                )];
                const boxscores = await mapWithConcurrency(
                    requiredGamePks,
                    6,
                    async (gamePk) => [gamePk, await fetchGameBoxscore(gamePk)]
                );
                const boxscoreByGame = new Map(boxscores);

                return preliminary.map((player) => {
                    const reference = getScheduleReferenceText(player.previousAbsenceGame, teamId);
                    if (player.japanese) {
                        return {
                            text: `${code}　${getPersonName(player.person)}　${player.gamesSinceAbsence}試合ぶりの欠場${reference}`,
                            priority: 2,
                            startRate: 1,
                            starts: 0
                        };
                    }
                    const starts = [...player.appearanceGamePks].reduce((total, gamePk) =>
                        total + Number(isPlayerStarterInBoxscore(
                            boxscoreByGame.get(gamePk),
                            teamId,
                            player.id
                        )), 0);
                    const startRate = starts / schedule.length;
                    if (startRate < 0.85) return null;
                    return {
                        text: `${code}　${getPersonName(player.person)}　${player.gamesSinceAbsence}試合ぶりの欠場${reference}`,
                        priority: 3,
                        startRate,
                        starts
                    };
                }).filter(Boolean)
                    .sort((a, b) => a.priority - b.priority ||
                        b.startRate - a.startRate || b.starts - a.starts);
            };

            const isGameBeforeCurrentStart = (split, context) => {
                const splitDate = String(split?.date ?? "").slice(0, 10);
                if (!splitDate || splitDate > context.officialDate) return false;
                const splitGamePk = Number(split?.game?.gamePk);
                if (splitGamePk === context.gamePk) return false;
                if (splitDate < context.officialDate) return true;

                const splitGameNumber = Number(split?.game?.gameNumber);
                if (context.gameNumber > 1 && Number.isFinite(splitGameNumber)) {
                    return splitGameNumber < context.gameNumber;
                }
                return context.gameNumber > 1 && Number.isFinite(splitGamePk) &&
                    splitGamePk < context.gamePk;
            };

            const summarizeCurrentStreaks = (splits, context) => {
                const games = splits
                    .filter((split) => isGameBeforeCurrentStart(split, context))
                    .sort((a, b) => {
                        const dateOrder = String(b?.date ?? "").localeCompare(String(a?.date ?? ""));
                        if (dateOrder) return dateOrder;
                        return (Number(b?.game?.gameNumber) || Number(b?.game?.gamePk) || 0) -
                            (Number(a?.game?.gameNumber) || Number(a?.game?.gamePk) || 0);
                    });

                let hitStreak = 0;
                let onBaseStreak = 0;
                let hitActive = true;
                let onBaseActive = true;
                let plateAppearances = 0;
                let atBats = 0;
                let hits = 0;

                games.forEach((split) => {
                    const stat = split?.stat ?? {};
                    const gamePa = getPlateAppearances(stat);
                    if (gamePa <= 0) return;

                    const gameHits = Number(stat.hits) || 0;
                    const reachedBase = gameHits +
                        (Number(stat.baseOnBalls) || 0) +
                        (Number(stat.hitByPitch) || 0);

                    if (hitActive) {
                        if (gameHits > 0) hitStreak += 1;
                        else hitActive = false;
                    }
                    if (onBaseActive) {
                        if (reachedBase > 0) onBaseStreak += 1;
                        else onBaseActive = false;
                    }

                    plateAppearances += gamePa;
                    atBats += Number(stat.atBats) || 0;
                    hits += gameHits;
                });

                return {
                    hitStreak,
                    onBaseStreak,
                    plateAppearances,
                    average: atBats > 0 ? hits / atBats : 0
                };
            };

            const getRosterCandidatesForSide = (data, side, roster) => {
                const playerMap = data?.liveData?.boxscore?.teams?.[side]?.players ?? {};
                const source = roster.length ? roster : Object.values(playerMap).map((player) => ({
                    person: player?.person,
                    position: player?.position
                }));
                return source
                    .map((entry) => {
                        const id = Number(entry?.person?.id);
                        const gamePlayer = playerMap[`ID${id}`] ?? {};
                        return {
                            id,
                            person: {
                                ...entry?.person,
                                ...(data?.gameData?.players?.[`ID${id}`] ?? {}),
                                ...(gamePlayer?.person ?? {})
                            },
                            rosterPosition: normalizePositionAbbreviation(
                                entry?.position ?? entry?.person?.primaryPosition
                            ),
                            battingOrder: Number.parseInt(gamePlayer?.battingOrder, 10),
                            currentGameBatting: gamePlayer?.stats?.batting ?? {},
                            currentGamePitching: gamePlayer?.stats?.pitching ?? {}
                        };
                    })
                    .filter((player, index, list) => player.id &&
                        list.findIndex((candidate) => candidate.id === player.id) === index);
            };

            const isPitcherCandidate = (player) =>
                player?.rosterPosition === "P" ||
                String(player?.person?.primaryPosition?.type ?? "").toLowerCase() === "pitcher";

            const isTwoWayCandidate = (player) => {
                const primaryPosition = normalizePositionAbbreviation(
                    player?.person?.primaryPosition
                );
                return player?.rosterPosition === "TWP" || primaryPosition === "TWP" ||
                    String(player?.person?.primaryPosition?.type ?? "")
                        .toLowerCase() === "two-way player";
            };

            const isAbsenceEligibleFielder = (player) => {
                if (isTwoWayCandidate(player)) {
                    return Number.isFinite(player?.battingOrder) ||
                        getPlateAppearances(player?.currentGameBatting) > 0;
                }
                return !isPitcherCandidate(player);
            };

            const chooseLongestStreak = (players, field) => players
                .filter((player) => player[`${field}Eligible`])
                .sort((a, b) => b[field] - a[field] ||
                    b.plateAppearances - a.plateAppearances ||
                    b.average - a.average)[0] ?? null;

            const fetchStreakNotes = async (data, gamePk) => {
                if (!isGameFinal(data)) {
                    return { away: [], home: [] };
                }
                if (streakNotesCache.has(String(gamePk))) {
                    return streakNotesCache.get(String(gamePk));
                }

                const officialDate = String(data?.gameData?.datetime?.officialDate ?? "");
                const season = Number(data?.gameData?.game?.season) || Number(officialDate.slice(0, 4));
                const context = {
                    officialDate,
                    gamePk: Number(gamePk),
                    gameNumber: Number(data?.gameData?.game?.gameNumber) || 1
                };

                const request = Promise.all(["away", "home"].map(async (side) => {
                    const team = data?.gameData?.teams?.[side] ?? {};
                    const roster = await fetchActiveRoster(team?.id, officialDate);
                    const candidates = getRosterCandidatesForSide(data, side, roster);
                    const participation = getCurrentGameParticipation(data, side);
                    const analyzed = await Promise.all(candidates.map(async (player) => {
                        const gameLogSplits = await fetchPlayerRegularSeasonGameLog(player.id, season);
                        const streaks = summarizeCurrentStreaks(
                            gameLogSplits,
                            context
                        );
                        const currentStat = player.currentGameBatting;
                        const currentPa = getPlateAppearances(currentStat);
                        const pregameHitStreak = streaks.hitStreak;
                        const pregameOnBaseStreak = streaks.onBaseStreak;
                        const streakPlayerEligible = participation.appeared.has(player.id) &&
                            !isPitcherCandidate(player);
                        streaks.hitStreakEligible = streakPlayerEligible && pregameHitStreak >= 2;
                        streaks.onBaseStreakEligible = streakPlayerEligible && pregameOnBaseStreak >= 2;
                        streaks.hitStreakStopped = false;
                        streaks.onBaseStreakStopped = false;
                        if (currentPa > 0) {
                            const currentHits = Number(currentStat?.hits) || 0;
                            streaks.hitStreak = currentHits > 0
                                ? pregameHitStreak + 1
                                : pregameHitStreak;
                            streaks.hitStreakStopped = currentHits === 0 && pregameHitStreak >= 2;
                            const reachedBase = (Number(currentStat?.hits) || 0) +
                                (Number(currentStat?.baseOnBalls) || 0) +
                                (Number(currentStat?.hitByPitch) || 0);
                            streaks.onBaseStreak = reachedBase > 0
                                ? pregameOnBaseStreak + 1
                                : pregameOnBaseStreak;
                            streaks.onBaseStreakStopped = reachedBase === 0 && pregameOnBaseStreak >= 2;
                        }
                        return { ...player, ...streaks, gameLogSplits };
                    }));
                    const code = getMlbTeamDisplayCode(team);
                    const hitLeader = chooseLongestStreak(analyzed, "hitStreak");
                    const onBaseLeader = chooseLongestStreak(analyzed, "onBaseStreak");
                    const streakLeaders = [...new Map(
                        [hitLeader, onBaseLeader]
                            .filter(Boolean)
                            .map((player) => [player.id, player])
                    ).values()];
                    const personalBestEntries = await Promise.all(streakLeaders.map(async (player) => [
                        player.id,
                        await fetchPlayerCareerBestStreaks(player, season, gamePk)
                    ]));
                    const personalBestByPlayer = new Map(personalBestEntries);
                    const notes = await buildCareerMilestoneNotes(analyzed, code, officialDate);
                    if (hitLeader) {
                        const stoppedSuffix = hitLeader.hitStreakStopped ? "でストップ" : "";
                        const personalSuffix = getPersonalStreakSuffix(
                            hitLeader.hitStreak,
                            personalBestByPlayer.get(hitLeader.id)?.hit,
                            hitLeader.hitStreakStopped
                        );
                        const priority = personalSuffix.includes("更新") ? 1
                            : personalSuffix.includes("タイ") ? 2
                                : personalSuffix.includes("あと") ? 5
                                    : hitLeader.hitStreakStopped ? 3 : 6;
                        notes.push({
                            text: `${code}　${getPersonName(hitLeader.person)}　連続試合安打：${hitLeader.hitStreak}試合${stoppedSuffix}${personalSuffix}`,
                            priority
                        });
                    }
                    if (onBaseLeader) {
                        const stoppedSuffix = onBaseLeader.onBaseStreakStopped ? "でストップ" : "";
                        const personalSuffix = getPersonalStreakSuffix(
                            onBaseLeader.onBaseStreak,
                            personalBestByPlayer.get(onBaseLeader.id)?.onBase,
                            onBaseLeader.onBaseStreakStopped
                        );
                        const priority = personalSuffix.includes("更新") ? 1
                            : personalSuffix.includes("タイ") ? 2
                                : personalSuffix.includes("あと") ? 5
                                    : onBaseLeader.onBaseStreakStopped ? 3 : 7;
                        notes.push({
                            text: `${code}　${getPersonName(onBaseLeader.person)}　連続試合出塁：${onBaseLeader.onBaseStreak}試合${stoppedSuffix}${personalSuffix}`,
                            priority
                        });
                    }
                    const schedule = await fetchTeamRegularSeasonSchedule(
                        team?.id,
                        season,
                        officialDate
                    );
                    notes.push(...await getAbsenceNotes(
                        analyzed.filter(isAbsenceEligibleFielder),
                        schedule,
                        participation.appeared,
                        gamePk,
                        team?.id,
                        code
                    ));
                    return [side, notes
                        .sort((a, b) => a.priority - b.priority)
                        .slice(0, 12)
                        .map((note) => note.text)];
                })).then((entries) => Object.fromEntries(entries));

                streakNotesCache.set(String(gamePk), request);
                return request;
            };

            const enrichPlayerHandedness = (data, player) => {
                const playerId = player?.person?.id;
                const personDetails = playerId
                    ? data?.gameData?.players?.[`ID${playerId}`] ?? {}
                    : {};
                return {
                    ...player,
                    person: { ...personDetails, ...player?.person },
                    pitchHand: player?.pitchHand ?? personDetails?.pitchHand,
                    batSide: player?.batSide ?? personDetails?.batSide
                };
            };

            const getThrowBatText = (player) => {
                const throws = getPitchHandText(player);
                const bats = HAND_LABELS[String(player?.batSide?.code ?? "").toUpperCase()] ?? "";
                return throws && bats ? `${throws}/${bats}` : "";
            };

            const getPitchHandText = (player) =>
                HAND_LABELS[String(player?.pitchHand?.code ?? "").toUpperCase()] ?? "";

            const getBattingStatText = (player, field) => {
                const value = Number(player?.stats?.batting?.[field]);
                return Number.isFinite(value) ? String(value) : "0";
            };

            const normalizePositionAbbreviation = (position) =>
                String(position?.abbreviation ?? position ?? "").trim().toUpperCase();

            const getPositionFromDescription = (description) => {
                const text = String(description ?? "").toLowerCase();
                const positions = [
                    ["designated hitter", "DH"], ["right field", "RF"],
                    ["center field", "CF"], ["left field", "LF"],
                    ["first base", "1B"], ["second base", "2B"],
                    ["third base", "3B"], ["shortstop", "SS"],
                    ["catcher", "C"], ["pitcher", "P"]
                ];
                return positions.find(([label]) => text.includes(label))?.[1] ?? "";
            };

            const buildDefensivePositionHistory = (data) => {
                const histories = { away: {}, home: {} };
                const fallbackPositions = { away: {}, home: {} };

                ["away", "home"].forEach((side) => {
                    const players = data?.liveData?.boxscore?.teams?.[side]?.players ?? {};
                    Object.values(players).forEach((player) => {
                        const playerId = Number(player?.person?.id);
                        if (!playerId) return;
                        const allPositions = (player?.allPositions ?? [])
                            .map(normalizePositionAbbreviation)
                            .filter(Boolean)
                            .filter((position, index, list) => !index || position !== list[index - 1]);
                        const initialPosition = allPositions[0] ||
                            normalizePositionAbbreviation(player?.position);
                        histories[side][playerId] = initialPosition ? [initialPosition] : [];
                        fallbackPositions[side][playerId] = allPositions;
                    });
                });

                const defensiveEventTypes = new Set([
                    "defensive_substitution",
                    "defensive_switch",
                    "pitching_substitution"
                ]);
                (data?.liveData?.plays?.allPlays ?? []).forEach((play) => {
                    const battingSide = play?.about?.halfInning === "top" ? "away" : "home";
                    const fieldingSide = battingSide === "away" ? "home" : "away";
                    (play?.playEvents ?? []).forEach((event) => {
                        const eventType = String(event?.details?.eventType ?? "").toLowerCase();
                        if (!defensiveEventTypes.has(eventType)) return;
                        const playerId = Number(event?.player?.id);
                        if (!playerId) return;
                        const position = normalizePositionAbbreviation(event?.position) ||
                            getPositionFromDescription(event?.details?.description);
                        if (!position) return;
                        const history = histories[fieldingSide][playerId] ?? [];
                        if (history[history.length - 1] !== position) history.push(position);
                        histories[fieldingSide][playerId] = history;
                    });
                });

                ["away", "home"].forEach((side) => {
                    Object.entries(fallbackPositions[side]).forEach(([playerId, positions]) => {
                        if ((histories[side][playerId]?.length ?? 0) <= 1 && positions.length > 1) {
                            histories[side][playerId] = positions;
                        }
                    });
                    Object.entries(histories[side]).forEach(([playerId, positions]) => {
                        histories[side][playerId] = positions.join("→");
                    });
                });
                return histories;
            };

            const getPlayerPositionHistoryText = (side, player) => {
                const playerId = Number(player?.person?.id);
                return state.defensivePositionHistory?.[side]?.[playerId] ||
                    normalizePositionAbbreviation(player?.allPositions?.[0]) ||
                    normalizePositionAbbreviation(player?.position);
            };

            const getRosterHandText = (side, player) => {
                const positions = getPlayerPositionHistoryText(side, player).split("→");
                const isPitcher = positions.includes("P") ||
                    normalizePositionAbbreviation(player?.position) === "P";
                return isPitcher ? getPitchHandText(player) : getThrowBatText(player);
            };

            const getPlayersForSide = (data, side) => {
                const boxscore = data?.liveData?.boxscore;
                const teamData = boxscore?.teams?.[side];

                if (!teamData) {
                    return Array.from({ length: 9 }, () => []);
                }

                const playerMap = teamData.players ?? {};
                const battingOrder = teamData.battingOrder ?? [];
                const slots = Array.from({ length: 9 }, () => []);
                const seen = new Set();

                Object.values(playerMap).forEach((player) => {
                    const rawOrder = Number.parseInt(player?.battingOrder, 10);

                    if (!Number.isFinite(rawOrder)) {
                        return;
                    }

                    const slotIndex = Math.floor(rawOrder / 100) - 1;

                    if (slotIndex < 0 || slotIndex >= 9) {
                        return;
                    }

                    slots[slotIndex].push(enrichPlayerHandedness(data, player));
                });

                slots.forEach((slot) => {
                    slot.sort((a, b) => {
                        const aOrder = Number.parseInt(a?.battingOrder, 10) || 0;
                        const bOrder = Number.parseInt(b?.battingOrder, 10) || 0;
                        return aOrder - bOrder;
                    });

                    slot.forEach((player) => {
                        const id = player?.person?.id;
                        if (id) {
                            seen.add(id);
                        }
                    });
                });

                battingOrder.forEach((playerId, index) => {
                    if (seen.has(playerId)) {
                        return;
                    }

                    const player = playerMap[`ID${playerId}`];

                    if (!player) {
                        return;
                    }

                    const slotIndex = index % 9;
                    slots[slotIndex].push(enrichPlayerHandedness(data, player));
                    seen.add(playerId);
                });

                if (slots.some((slot) => slot.length)) {
                    return slots;
                }

                Object.values(playerMap)
                    .filter((player) => player?.stats?.batting)
                    .slice(0, 9)
                    .forEach((player, index) => {
                        slots[index].push(enrichPlayerHandedness(data, player));
                    });

                return slots;
            };

            const getPitchersForSide = (data, side) => {
                const boxscore = data?.liveData?.boxscore;
                const teamData = boxscore?.teams?.[side];

                if (!teamData) {
                    return [];
                }

                const playerMap = teamData.players ?? {};
                const pitchers = teamData.pitchers ?? [];

                return pitchers
                    .map((playerId) => playerMap[`ID${playerId}`])
                    .filter(Boolean)
                    .map((player) => enrichPlayerHandedness(data, player));
            };

            const getPitcherDecisionSuffix = (person) => {
                if (!isGameFinal(state.gameData)) return "";

                const playerId = Number(person?.id);
                if (!Number.isFinite(playerId)) return "";

                const decisions = state.gameData?.liveData?.decisions ?? {};
                if (Number(decisions?.winner?.id) === playerId) return " (W)";
                if (Number(decisions?.loser?.id) === playerId) return " (L)";
                if (Number(decisions?.save?.id) === playerId) return " (S)";
                return "";
            };

            const getJapaneseDivisionName = (team) => {
                const divisionName =
                    team?.division?.name ||
                    team?.division?.nameShort ||
                    team?.division?.abbreviation ||
                    "";

                const normalized = normalizeLookupKey(divisionName)
                    .replace(/division$/, "");

                return JAPANESE_DIVISION_NAMES[normalized] || "";
            };

            const getTeamRecord = (team, boxscoreTeam) => {
                const record =
                    team?.record ||
                    team?.leagueRecord ||
                    boxscoreTeam?.team?.record ||
                    boxscoreTeam?.team?.leagueRecord ||
                    {};

                const wins = Number(record?.wins);
                const losses = Number(record?.losses);

                return {
                    wins: Number.isFinite(wins) ? wins : null,
                    losses: Number.isFinite(losses) ? losses : null
                };
            };

            const getTeamState = (data, side) => {
                const team = data?.gameData?.teams?.[side] ?? {};
                const boxscoreTeam = data?.liveData?.boxscore?.teams?.[side];

                const nhkTeamName =
                    getNhkTeamName(team) ||
                    getNhkTeamName(boxscoreTeam?.team) ||
                    (side === "away" ? "先攻チーム" : "後攻チーム");

                const record = getTeamRecord(team, boxscoreTeam);

                return {
                    abbreviation: getMlbTeamDisplayCode(team) || nhkTeamName,
                    name: nhkTeamName,
                    wins: record.wins,
                    losses: record.losses,
                    division: getJapaneseDivisionName(team) ||
                        getJapaneseDivisionName(boxscoreTeam?.team) ||
                        TEAM_DIVISION_BY_NAME[nhkTeamName] || "",
                    players: getPlayersForSide(data, side),
                    pitchers: getPitchersForSide(data, side)
                };
            };

            const getGameDateText = (data) => {
                const dateText = data?.gameData?.datetime?.officialDate;

                if (!dateText) {
                    return "-";
                }

                const [year, month, day] = dateText.split("-");
                return `${year}年${Number(month)}月${Number(day)}日`;
            };

            const getStartTimeText = (data) => {
                const iso = data?.gameData?.datetime?.dateTime;

                if (!iso) {
                    return "-";
                }

                const date = new Date(iso);

                if (Number.isNaN(date.getTime())) {
                    return "-";
                }

                return new Intl.DateTimeFormat("ja-JP", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                }).format(date);
            };

            const getEndTimeText = (data) => {
                const endTime = data?.gameData?.datetime?.endTime;

                if (endTime) {
                    return endTime;
                }

                return "-";
            };

            const getDurationText = (data) => {
                const minutes = data?.gameData?.gameInfo?.gameDurationMinutes;

                if (!Number.isFinite(minutes)) {
                    return "-";
                }

                const hours = Math.floor(minutes / 60);
                const remainder = minutes % 60;

                return `${hours}:${String(remainder).padStart(2, "0")}`;
            };

            const getWeatherText = (data) => {
                const weather = data?.gameData?.weather;

                if (!weather) {
                    return "-";
                }

                const condition = translateWeatherCondition(weather.condition);
                const temp = fahrenheitToCelsius(weather.temp);

                return [condition, temp].filter(Boolean).join(" ") || "-";
            };

            const getStatusText = (data) => {
                return (
                    data?.gameData?.status?.detailedState ||
                    data?.gameData?.status?.abstractGameState ||
                    "-"
                );
            };

            const getLineScoreValue = (side, inningNumber) => {
                if (shouldShowNoBottomMark(side, inningNumber)) {
                    return "×";
                }

                const inning = state.gameData?.liveData?.linescore?.innings?.find(
                    (item) => item?.num === inningNumber
                );

                const value = inning?.[side]?.runs;
                return value === undefined || value === null ? "" : String(value);
            };

            const getTeamTotal = (side, key) => {
                const value = state.gameData?.liveData?.linescore?.teams?.[side]?.[key];
                return value === undefined || value === null ? "" : String(value);
            };

            const buildTopScore = () => {
                const container = createElement("section", "top-score");

                container.append(createElement("div", "", ""));

                for (let inning = 1; inning <= state.innings; inning += 1) {
                    container.append(createElement("div", "", String(inning)));
                }

                ["R", "H", "E"].forEach((label) => {
                    container.append(createElement("div", "", label));
                });

                ["away", "home"].forEach((side) => {
                    container.append(
                        createElement("div", "team-name", state[side].name)
                    );

                    for (let inning = 1; inning <= state.innings; inning += 1) {
                        const value = getLineScoreValue(side, inning);
                        container.append(
                            createElement(
                                "div",
                                value === "×" ? "no-bottom" : "",
                                value
                            )
                        );
                    }

                    container.append(
                        createElement("div", "", getTeamTotal(side, "runs")),
                        createElement("div", "", getTeamTotal(side, "hits")),
                        createElement("div", "", getTeamTotal(side, "errors"))
                    );
                });

                return container;
            };

            const formatHeadToHeadWins = (value) =>
                Number.isFinite(value) ? `${value}勝` : "-";

            const buildHeadToHeadTable = () => {
                const table = createElement("section", "head-to-head-table");
                const record = state.headToHead ?? getEmptyHeadToHeadRecord();
                const rows = [
                    ["対戦成績", state.away.abbreviation, state.home.abbreviation, "head"],
                    [
                        "今シーズン",
                        formatHeadToHeadWins(record.awaySeason),
                        formatHeadToHeadWins(record.homeSeason),
                        ""
                    ],
                    [
                        "通算",
                        formatHeadToHeadWins(record.awayCareer),
                        formatHeadToHeadWins(record.homeCareer),
                        ""
                    ]
                ];
                rows.forEach(([label, awayValue, homeValue, className]) => {
                    table.append(
                        createElement("div", `head-to-head-label ${className}`.trim(), label),
                        createElement("div", className, awayValue),
                        createElement("div", className, homeValue)
                    );
                });
                return table;
            };

            const getChallengeTeamInfo = (data, teamId) => {
                const numericTeamId = Number(teamId);
                for (const side of ["away", "home"]) {
                    const team = data?.gameData?.teams?.[side] ?? {};
                    if (Number(team?.id) !== numericTeamId) continue;
                    return {
                        side,
                        code: getMlbTeamDisplayCode(team)
                    };
                }
                return { side: "", code: "" };
            };

            const getChallengePlayer = (data, playerId) =>
                data?.gameData?.players?.[`ID${Number(playerId)}`] ?? {};

            const getAbsChallengerRole = (data, play, reviewDetails) => {
                const playerId = Number(reviewDetails?.player?.id);
                if (playerId === Number(play?.matchup?.batter?.id)) return "打者";
                if (playerId === Number(play?.matchup?.pitcher?.id)) return "投手";

                const person = getChallengePlayer(data, playerId);
                const position = String(person?.primaryPosition?.abbreviation ?? "").toUpperCase();
                if (position === "C") return "捕手";
                if (position === "P") return "投手";

                const challengeTeam = getChallengeTeamInfo(data, reviewDetails?.challengeTeamId);
                const battingSide = play?.about?.halfInning === "top" ? "away" : "home";
                return challengeTeam.side === battingSide ? "打者" : "捕手";
            };

            const getReplayTargetData = (play) => {
                const description = String(play?.result?.description ?? "");
                const parenthetical = description.match(/challenged\s*\(([^)]+)\)/i)?.[1] ?? "";
                return {
                    label: parenthetical,
                    event: String(play?.result?.event ?? ""),
                    eventType: String(play?.result?.eventType ?? ""),
                    description
                };
            };

            const getReplayPlayLabel = (target, play) => {
                const label = `${target?.label ?? ""} ${target?.event ?? ""}`.toLowerCase();
                if (/play at 1st|first base/.test(label)) return "一塁プレー";
                if (/play at 2nd|second base/.test(label)) return "二塁プレー";
                if (/play at 3rd|third base/.test(label)) return "三塁プレー";
                if (/play at home|home plate/.test(label)) return "本塁プレー";
                if (/tag play/.test(label)) return "タッチプレー";
                if (/stolen base|steal/.test(label)) return "盗塁";
                if (/pickoff/.test(label)) return "牽制";
                if (/catch|no catch/.test(label)) return "捕球";
                if (/home run|homer/.test(label)) return "ホームラン";
                if (/hit by pitch|hbp/.test(label)) return "HBP";
                if (/fair|foul/.test(label)) return "フェア・ファウル";
                return target?.label || target?.event || String(play?.result?.event ?? "");
            };

            const getReplayFinalRuling = (target, play) => {
                const label = `${target?.label ?? ""} ${target?.event ?? ""}`.toLowerCase();
                const eventType = String(play?.result?.eventType ?? "").toLowerCase();
                const event = String(play?.result?.event ?? "").toLowerCase();
                if (/play at|base|tag play|stolen|steal|pickoff/.test(label)) {
                    return (play?.runners ?? []).some((runner) => runner?.movement?.isOut)
                        ? "アウト"
                        : "セーフ";
                }
                if (/catch|no catch/.test(label)) {
                    return play?.result?.isOut ? "キャッチ" : "ノーキャッチ";
                }
                if (/fair|foul/.test(label)) {
                    return eventType.includes("foul") || event.includes("foul") ? "ファウル" : "フェア";
                }
                if (/home run|homer/.test(label)) {
                    return eventType === "home_run" ? "ホームラン" : "ホームランではない";
                }
                if (/hit by pitch|hbp/.test(label)) {
                    return eventType === "hit_by_pitch" ? "HBP" : "HBPではない";
                }
                return String(play?.result?.event ?? "");
            };

            const getOppositeReplayRuling = (ruling) => ({
                "アウト": "セーフ",
                "セーフ": "アウト",
                "ファウル": "フェア",
                "フェア": "ファウル",
                "キャッチ": "ノーキャッチ",
                "ノーキャッチ": "キャッチ",
                "ホームラン": "ホームランではない",
                "ホームランではない": "ホームラン",
                "HBP": "HBPではない",
                "HBPではない": "HBP"
            }[ruling] ?? ruling);

            const getAbsFinalCall = (event) => {
                if (event?.details?.isBall) return "ボール";
                if (event?.details?.isStrike) return "ストライク";
                const call = String(event?.details?.call?.description ?? "").toLowerCase();
                if (call.includes("ball")) return "ボール";
                if (call.includes("strike")) return "ストライク";
                return "";
            };

            const getAbsTargetData = (event, review) => {
                const finalCall = getAbsFinalCall(event);
                const originalCall = review?.isOverturned
                    ? finalCall === "ボール" ? "ストライク" : "ボール"
                    : finalCall;
                return {
                    originalCall,
                    finalCall,
                    call: String(event?.details?.call?.description ?? ""),
                    callCode: String(event?.details?.call?.code ?? ""),
                    description: String(event?.details?.description ?? ""),
                    pitchType: String(event?.details?.type?.description ?? "")
                };
            };

            const getAbsBatterText = (data, play) => {
                const batterId = Number(play?.matchup?.batter?.id);
                const batter = getChallengePlayer(data, batterId);
                return getPersonName({ ...batter, ...play?.matchup?.batter }) || "—";
            };

            const getAbsPitchNumberText = (play, event, eventIndex) => {
                const apiPitchNumber = Number(event?.pitchNumber);
                if (Number.isFinite(apiPitchNumber) && apiPitchNumber > 0) {
                    return `${apiPitchNumber}球目`;
                }

                const pitchCount = (play?.playEvents ?? [])
                    .slice(0, eventIndex + 1)
                    .filter((playEvent) => playEvent?.isPitch || playEvent?.type === "pitch")
                    .length;
                return pitchCount > 0 ? `${pitchCount}球目` : "—";
