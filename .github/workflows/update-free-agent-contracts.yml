name: Update MLB Free Agent Contracts

on:
  workflow_dispatch:
  schedule:
    # Off-season: check FanGraphs every hour from November through March (UTC).
    - cron: "0 * * 11,12,1,2,3 *"
    # In-season: keep contract tracker data reasonably fresh without frequent polling.
    - cron: "0 */6 * 4-10 *"

permissions:
  contents: write

concurrency:
  group: update-free-agent-contracts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch FanGraphs free-agent contracts
        run: node scripts/update-free-agent-contracts.mjs
      - name: Commit updated contract data
        run: |
          if git diff --quiet -- js/free-agent-contracts.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/free-agent-contracts.js index.html
          git commit -m "Update MLB free agent contract data"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
