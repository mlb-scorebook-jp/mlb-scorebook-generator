name: Update MLB Latest News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch MLB official news
        run: node scripts/update-mlb-latest-news.mjs
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- js/mlb-latest-news.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/mlb-latest-news.js
          git commit -m "Update MLB latest news"
          git push
