name: Update MLB Latest News

on:
  workflow_dispatch:
  schedule:
    # Off-season: poll once per hour from November through March (UTC).
    - cron: "0 * * 11,12,1,2,3 *"
    # Regular season: keep the faster five-minute news refresh from April through October.
    - cron: "*/5 * * 4-10 *"

permissions:
  contents: write

concurrency:
  group: update-mlb-latest-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch MLB official news
        run: node scripts/update-mlb-latest-news.mjs
      - name: Extract verified free-agent progress from official articles
        run: node scripts/update-free-agent-progress.mjs
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- js/mlb-latest-news.js js/free-agent-progress.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/mlb-latest-news.js js/free-agent-progress.js index.html
          git commit -m "Update MLB news and free-agent progress"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
